<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：熱血レジェンド版</title>
<style>
  :root { --court-green: #2e8b57; --gold: #ffd700; }
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; background-color: #1a1a1a; color: #333; }

  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 15px; }
  #sidebar { flex: 0 0 240px; background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  
  #top-bar { background: white; padding: 10px; border-radius: 15px; display: flex; align-items: center; justify-content: space-around; }
  #diceNum { font-size: 50px; font-weight: bold; color: var(--court-green); }
  
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; flex-grow: 1; }
  .square { background: var(--court-green); border: 2px solid white; border-radius: 5px; color: white; padding: 5px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .type-start { background: #27ae60 !important; }
  .type-goal { background: #2c3e50 !important; }
  .type-reward { background: #f1c40f !important; color: #333 !important; }
  .type-mini { background: #e74c3c !important; }
  .type-warp { background: #3498db !important; }

  /* プレイヤー情報 */
  .money-card { padding: 8px; border-radius: 10px; background: #fff; border: 4px solid #ddd; font-size: 13px; position: relative; }
  .active-p { border-color: #ffde59; box-shadow: 0 0 15px rgba(255,222,89,0.5); }
  .is-awakened { border-color: var(--gold) !important; background: #fffde6 !important; animation: glow 1.5s infinite; }
  @keyframes glow { 0% { box-shadow: 0 0 5px var(--gold); } 50% { box-shadow: 0 0 20px var(--gold); } 100% { box-shadow: 0 0 5px var(--gold); } }
  .status-badge { font-size: 10px; padding: 2px 5px; border-radius: 5px; display: block; margin-top: 3px; font-weight: bold; }
  .token { width: 16px; height: 16px; border-radius: 50%; border: 1px solid white; display: inline-block; margin: 1px; transition: 0.3s; }

  /* 全画面イベント演出 */
  #event-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 5000; justify-content: center; align-items: center;
    flex-direction: column; color: white; text-align: center;
  }
  .event-card { background: white; color: #333; padding: 40px; border-radius: 30px; width: 70%; max-width: 800px; border: 10px solid var(--court-green); }
  .awakened-card { border-color: var(--gold) !important; background: #fffde6 !important; }
  .event-title { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
  .event-text { font-size: 50px; font-weight: bold; color: #e74c3c; margin-bottom: 15px; }
  .event-sub { font-size: 24px; color: #666; }

  button { padding: 15px 30px; font-size: 20px; background: var(--court-green); color: white; border: none; border-radius: 50px; cursor: pointer; }
</style>
</head>
<body>

<div id="event-overlay">
  <div id="ev-card" class="event-card">
    <div id="ev-player" class="event-title"></div>
    <div id="ev-text" class="event-text"></div>
    <div id="ev-money" class="event-sub"></div>
    <div id="ev-mini-note" style="display:none; color:#e74c3c; font-weight:bold; margin-top:20px;">※ミニゲーム終了後に閉じてください</div>
    <button id="ev-close" onclick="closeEvent()" style="margin-top:30px; display:none;">確認して次へ</button>
  </div>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:10px 0;">🎾 部員ステータス</h3>
    <div id="statusArea"></div>
  </div>

  <div id="game-area">
    <div id="top-bar">
      <div id="diceNum">🎲 ?</div>
      <button id="diceBtn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const SLIDE_URL = "https://docs.google.com/presentation/d/your-id-here/edit"; 

const squares = [
  {t:"start", txt:"集合"}, {t:"normal", txt:"ラケット粉砕", m:-20000}, {t:"normal", txt:"チャリパンク", m:-2000}, {t:"reward", txt:"チャンス"},
  {t:"normal", txt:"大会決定", m:5000}, {t:"mini", txt:"★ミニゲーム"}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"ダブルス練習", special:"doubles"},
  {t:"normal", txt:"試合に勝利", m:3000}, {t:"reward", txt:"ドリンク"}, {t:"normal", txt:"雨でオフ", m:0}, {t:"mini", txt:"★ミニゲーム"},
  {t:"normal", txt:"雪で筋トレ", m:-1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"フォーム迷走", m:-1000}, {t:"reward", txt:"臨時ボーナス"},
  {t:"normal", txt:"ダブルス大会", special:"doubles"}, {t:"mini", txt:"★ミニゲーム"}, {t:"normal", txt:"スコア＋", m:2000}, {t:"warp", txt:"ワープ"},
  {t:"normal", txt:"スコア－", m:-1500}, {t:"normal", txt:"ガット張替", m:-2000}, {t:"reward", txt:"おやつタイム"}, {t:"mini", txt:"★ミニゲーム"},
  {t:"normal", txt:"顧問に褒誉", m:1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"サーブ迷走", m:-1000}, {t:"reward", txt:"部費余り"},
  {t:"normal", txt:"すね強打", m:-1000}, {t:"mini", txt:"★ミニゲーム"}, {t:"normal", txt:"最高の一打", m:2000}, {t:"goal", txt:"引退！"}
];

const rewards = [
  {n:"お金 +3000円", v:3000, w:30}, {n:"お金 +20000円", v:20000, w:30},
  {n:"お金 +5000円", v:5000, w:30}, {n:"🧃 ジュース現物", v:0, w:5}, {n:"🍪 お菓子現物", v:0, w:5}
];

let players = []; let turn = 0; let isMoving = false; let globalTurnCount = 0;

function init() {
  let count = parseInt(prompt("人数は？")) || 1;
  for(let i=0; i<count; i++){
    players.push({ 
        id:i, name: prompt((i+1)+"人目の名前")||"部員"+(i+1), pos: 0, money: 0, goal: false, color: `hsl(${i*(360/count)}, 70%, 50%)`,
        streak: 0, awakened: false, penalty: 0 
    });
  }
  renderBoard(); updateStatus();
}

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => {
    const div = document.createElement("div"); div.className = `square type-${s.t}`;
    div.innerHTML = `<div><small>${i}</small> <b>${s.txt}</b></div><div id="p-at-${i}"></div>`;
    b.appendChild(div);
  });
  players.forEach(p => {
    const t = document.createElement("div"); t.className = "token"; t.style.background = p.color;
    if(p.awakened) t.style.boxShadow = "0 0 10px yellow";
    document.getElementById(`p-at-${p.pos}`).appendChild(t);
  });
}

function updateStatus() {
  document.getElementById("statusArea").innerHTML = players.map((p, i) => `
    <div class="money-card ${i===turn?'active-p':''} ${p.awakened?'is-awakened':''}" style="${p.goal?'opacity:0.4':''}">
      <b style="color:${p.color}">● ${p.name}</b><br>💰 <b>${p.money}</b>円
      ${p.awakened ? '<span class="status-badge" style="background:var(--gold)">⚡️ ゾーン突入中</span>' : ''}
      ${p.penalty > 0 ? '<span class="status-badge" style="background:#888; color:white;">🧶 球拾い中</span>' : ''}
    </div>`).join("");
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  
  // 球拾い判定
  if(players[turn].penalty > 0) {
    players[turn].penalty--;
    showSimpleEvent(players[turn], "球拾い", "忙しくて動けない！(あと"+players[turn].penalty+"回休み)");
    return;
  }

  isMoving = true; document.getElementById("diceBtn").disabled = true;
  let dice = 0; let cnt = 0;
  const timer = setInterval(() => {
    // 覚醒中は4,5,6しか出ない
    dice = players[turn].awakened ? Math.floor(Math.random() * 3) + 4 : Math.floor(Math.random() * 6) + 1;
    document.getElementById("diceNum").innerText = "🎲 " + dice;
    if(cnt++ > 10) { clearInterval(timer); move(dice); }
  }, 60);
}

function move(steps) {
  let p = players[turn];
  p.pos = Math.min(squares.length - 1, p.pos + steps);
  if(p.pos === squares.length - 1) p.goal = true;
  renderBoard();
  
  const s = squares[p.pos];
  showEventOverlay(p, s);
}

function showEventOverlay(p, s) {
  const overlay = document.getElementById("event-overlay");
  const evCard = document.getElementById("ev-card");
  const evP = document.getElementById("ev-player");
  const evT = document.getElementById("ev-text");
  const evM = document.getElementById("ev-money");
  const evClose = document.getElementById("ev-close");
  const evMini = document.getElementById("ev-mini-note");

  evP.innerText = `【 ${p.name} の番 】`;
  evP.style.color = p.color;
  evT.innerText = s.txt;
  evM.innerText = "";
  evClose.style.display = "none";
  evMini.style.display = "none";
  evCard.className = p.awakened ? "event-card awakened-card" : "event-card";
  overlay.style.display = "flex";

  let moneyChange = s.m || 0;
  let isPositive = moneyChange > 0;

  if(s.t === "mini") {
    evM.innerText = "現実でミニゲーム開始！";
    evMini.style.display = "block";
    evClose.style.display = "inline-block";
    window.open(SLIDE_URL, '_blank');
  } else if(s.t === "reward") {
    const totalWeight = rewards.reduce((sum, r) => sum + r.w, 0);
    let random = Math.random() * totalWeight;
    let final;
    for (const r of rewards) { if (random < r.w) { final = r; break; } random -= r.w; }
    p.money += final.v;
    evT.innerText = "ご褒美！";
    evM.innerText = final.n;
    isPositive = true;
    setTimeout(closeEvent, 2500);
  } else if(s.t === "warp") {
    const jump = Math.floor(Math.random()*3)+1; const fwd = Math.random()>0.5;
    p.pos = fwd ? Math.min(squares.length-1, p.pos+jump) : Math.max(0, p.pos-jump);
    evM.innerText = fwd ? `${jump}マス進む！🚀` : `${jump}マス戻る...🌀`;
    renderBoard();
    setTimeout(closeEvent, 2500);
  } else if(s.special === "doubles") {
    let partner; do { partner = players[Math.floor(Math.random()*players.length)]; } while(partner === p);
    if(Math.random() > 0.5) { 
      p.money += 5000; partner.money += 5000; evT.innerText = "ダブルス勝利！"; evM.innerText = `${partner.name}と+5000円！`; isPositive = true;
    } else { 
      p.money -= 2000; partner.money -= 2000; evT.innerText = "ダブルス敗北..."; evM.innerText = `${partner.name}と-2000円`; isPositive = false;
    }
    setTimeout(closeEvent, 2500);
  } else {
    p.money += moneyChange;
    evM.innerText = moneyChange !== 0 ? (moneyChange > 0 ? `+${moneyChange}円` : `${moneyChange}円`) : "特になし";
    setTimeout(closeEvent, 2500);
  }

  // 覚醒・球拾いロジック
  if(isPositive) {
    p.streak++; if(p.streak >= 2 && !p.awakened) { p.awakened = true; evT.innerText = "ゾーン突入！！"; evM.innerText = "サイコロが強化された！"; }
  } else if(moneyChange < 0) {
    p.streak--; if(p.streak <= -2) { p.penalty = 1; p.streak = 0; evT.innerText = "球拾い決定..."; evM.innerText = "次の一回休み！"; }
    p.awakened = false;
  }
}

function showSimpleEvent(p, title, text) {
  const overlay = document.getElementById("event-overlay");
  document.getElementById("ev-player").innerText = p.name;
  document.getElementById("ev-text").innerText = title;
  document.getElementById("ev-money").innerText = text;
  document.getElementById("ev-close").style.display = "none";
  overlay.style.display = "flex";
  setTimeout(closeEvent, 2500);
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  finishTurn();
}

function finishTurn() {
  globalTurnCount++;
  updateStatus();
  
  // 5ターンごとに部費徴収
  if(globalTurnCount % (players.length * 2) === 0) {
    const lowPlayer = [...players].sort((a,b)=>a.money-b.money)[0];
    players.forEach(pl => { if(pl !== lowPlayer && !pl.goal) pl.money -= 3000; });
    alert("【緊急イベント】部費徴収！\n全員から3000円集めます！（最下位の"+lowPlayer.name+"は免除！）");
    updateStatus();
  }

  if(players.every(pl => pl.goal)) {
    alert("全員引退！優勝は " + [...players].sort((a,b)=>b.money-a.money)[0].name + "！");
  } else {
    do { turn = (turn + 1) % players.length; } while(players[turn].goal);
    isMoving = false;
    document.getElementById("diceBtn").disabled = false;
  }
}

init();
</script>
</body>
</html>
