<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：完全版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  
  .explain-card { background: white; color: #333; padding: 30px; border-radius: 30px; border: 10px solid var(--green); max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  .explain-card h1 { color: var(--green); margin-top: 0; font-size: 28px; }
  .explain-card p { text-align: left; font-size: 16px; line-height: 1.4; margin: 15px 0; }

  /* 特性選択用のスタイル */
  .setup-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; text-align: left; }
  .setup-item { border: 2px solid #ddd; padding: 15px; border-radius: 15px; }
  .trait-select { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; margin-top: 10px; }
  .name-input { width: 100%; padding: 10px; font-size: 18px; border-radius: 8px; border: 2px solid var(--green); box-sizing: border-box; }

  .pyramid-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; gap: 4px; width: 100%; }
  .p-row { padding: 8px; border-radius: 4px; font-weight: bold; color: white; text-align: center; border: 1px solid rgba(0,0,0,0.1); box-sizing: border-box; }
  .p-1 { width: 40%; background: #ffd700; color: #333; }
  .p-2 { width: 55%; background: #ff4500; }
  .p-3 { width: 70%; background: #32cd32; }
  .p-4 { width: 85%; background: #4682b4; }
  .p-5 { width: 95%; background: #8a2be2; }
  .p-6 { width: 100%; background: #000000; }

  button.big-btn { font-size: 22px; padding: 12px 40px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 5px 0 #1b5e38; transition: 0.1s; margin-top: 10px; }
  button.big-btn:active { transform: translateY(3px); box-shadow: none; }

  #sidebar { flex: 0 0 280px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; }
  #statusArea { overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }
  .money-card { padding: 10px; border-radius: 10px; background: #fff; border: 3px solid #ddd; margin-bottom: 8px; position: relative; }
  .active-p { border-color: #ffde59 !important; transform: scale(1.05); left: 10px; box-shadow: 0 0 15px rgba(255,222,89,0.8); background: #fffde0 !important; }
  .active-p::before { content: "🎾"; position: absolute; left: -25px; top: 35%; font-size: 20px; }
  .rank-badge { font-size: 10px; font-weight: bold; color: white; background: #666; padding: 2px 6px; border-radius: 4px; }
  .trait-badge { font-size: 11px; color: #d35400; font-weight: bold; display: block; margin-top: 4px; border-top: 1px dashed #ccc; padding-top: 2px; }
  .condition-badge { font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; margin-left: 5px; }

  #game-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  #top-bar { background: white; padding: 10px; border-radius: 15px; display: flex; justify-content: space-around; align-items: center; }
  #weather-display { padding: 10px 20px; border-radius: 20px; font-weight: bold; background: var(--green); color: white; font-size: 14px; }
  
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; }
  .token { width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; display: inline-block; margin: 1px; }
  #big-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: bold; color: white; text-shadow: 0 0 30px rgba(0,0,0,1); z-index: 10000; display: none; white-space: nowrap; }
  .rolling { animation: dice-roll 0.1s infinite linear; }
  @keyframes dice-roll { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .result-item { background: white; color: #333; margin: 10px 0; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; opacity: 0; transform: translateY(20px); transition: 0.5s; font-size: 24px; width: 100%; box-sizing: border-box; }
  #revolt-overlay { background: rgba(200, 0, 0, 0.98); z-index: 30000; display: none; }
  .revolt-title { font-size: 60px; font-weight: bold; color: yellow; text-shadow: 4px 4px 0 #000; animation: shake 0.2s infinite; }
</style>
</head>
<body>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card" id="flow-card">
    <h1 id="flow-title">🎾 テニス部人生ゲーム</h1>
    <div id="flow-content">
      <p style="text-align: center;">引退試合を始めます。まずは参加人数を教えてください。</p>
      <input type="number" id="player-count-input" value="2" min="1" max="6" style="font-size: 24px; width: 60px; text-align: center; border-radius: 10px; border: 2px solid var(--green);">
      <br>
      <button class="big-btn" onclick="startExplanation()">次へ</button>
    </div>
  </div>
</div>

<div id="revolt-overlay" class="full-overlay">
  <div class="revolt-title">💥 下剋上 発生！</div>
  <div id="revolt-matchup" style="font-size: 32px; margin: 20px 0; color: white; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 20px; border: 2px solid white;"></div>
  <div style="display: flex; gap: 30px; font-size: 60px; margin: 30px 0; align-items: center; justify-content: center;">
    <div id="rev-dice-p1" style="background: white; color: black; padding: 20px 30px; border-radius: 15px; box-shadow: 0 10px 0 #ccc;">🎲?</div>
    <div style="color: yellow; font-size: 40px; font-weight: bold;">VS</div>
    <div id="rev-dice-p2" style="background: white; color: black; padding: 20px 30px; border-radius: 15px; box-shadow: 0 10px 0 #ccc;">🎲?</div>
  </div>
  <div id="revolt-msg" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;"></div>
  <button id="revolt-go-btn" class="big-btn" style="background: yellow; color: black;" onclick="startRevoltFight()">運命のダイスを振る！</button>
  <button id="revolt-close-btn" class="big-btn" style="display: none;" onclick="finishRevolt演出()">現実に戻る</button>
</div>

<div id="special-rule-overlay" class="full-overlay"><div class="explain-card"><h1 id="special-title"></h1><p id="special-text"></p><div id="dark-contract-btns" style="display:none;"><button class="big-btn" onclick="acceptDarkContract()">闇と契約する</button><button class="big-btn" style="background:#666; margin-left:10px;" onclick="closeSpecialRule()">断る</button></div><button id="special-understand-btn" class="big-btn" onclick="closeSpecialRule()">理解した</button></div></div>
<div id="event-overlay" class="full-overlay" style="background: rgba(0,0,0,0.85);"><div class="explain-card" style="text-align:center;"><div id="ev-player" style="font-size:20px; font-weight:bold; color:var(--green);"></div><div id="ev-text" style="font-size:36px; font-weight:bold; margin:10px 0;"></div><div id="ev-money" style="font-size:28px; color:var(--red); font-weight:bold;"></div><button id="ev-close" class="big-btn" onclick="closeEvent()">次へ</button><button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button></div></div>
<div id="big-alert"></div>
<div id="result-overlay" class="full-overlay"><h1>🏅 最終結果発表 🏅</h1><div id="rank-list" style="width: 90%; max-width: 600px;"></div><button class="big-btn" style="margin-top:30px;" onclick="location.reload()">もう一度部活をやる</button></div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:5px 0;">部員名簿</h3>
    <div id="statusArea"></div>
    <button id="revolt-btn" onclick="showRevolt演出()" style="width:100%; margin-top:5px; background:#e67e22; border:none; color:white; padding:12px; border-radius:8px; cursor:pointer; display:none; font-weight:bold;">💥 審判に異議申し立て</button>
  </div>
  <div id="game-area">
    <div id="top-bar">
      <div id="weather-display">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:40px; font-weight:bold; width:80px; text-align:center;">🎲</div>
      <button id="diceBtn" class="big-btn" style="padding:15px 40px;" onclick="checkDarkShop()">サイコロを振る</button>
      <div style="font-size:14px; background:var(--red); color:white; padding:10px; border-radius:10px;">徴収まで: <span id="turns-left" style="font-weight:bold;">10</span></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, type, duration) {
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.start(); osc.stop(audioCtx.currentTime + duration);
}
const sounds = { dice:()=>playTone(600,'square',0.1), ev:()=>playTone(523,'sine',0.2), bad:()=>playTone(150,'sawtooth',0.3) };

const squares = [{t:"start", txt:"集合"}, {t:"normal", txt:"ガット切れ", m:-3000}, {t:"normal", txt:"チャリパンク", m:-1000}, {t:"reward", txt:"ラッキー"}, {t:"normal", txt:"大会決定", m:5000}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"居残特訓", m:500}, {t:"normal", txt:"居残り練習", m:-500}, {t:"normal", txt:"勝利報酬", m:5000}, {t:"reward", txt:"ドリンク"}, {t:"normal", txt:"休み", m:0}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"筋トレ代", m:-500}, {t:"normal", txt:"朝練", m:1000}, {t:"normal", txt:"好調！", m:2000}, {t:"reward", txt:"OBの差し入れ"}, {t:"normal", txt:"大会遠征費", m:-2000}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"臨時ボーナス", m:3000}, {t:"normal", txt:"掃除当番", m:200}, {t:"normal", txt:"忘れ物罰金", m:-1000}, {t:"normal", txt:"ガット張替", m:-1500}, {t:"reward", txt:"おやつタイム"}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"褒美", m:2000}, {t:"normal", txt:"自主練", m:1000}, {t:"normal", txt:"練習集中", m:1000}, {t:"reward", txt:"部費還元"}, {t:"normal", txt:"強打失敗", m:-1000}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"絶好調", m:4000}, {t:"goal", txt:"引退"}];
const traits = [
  {name:"顧問の愛弟子", id:"fav", desc:"10ターンごとの部費徴収を毎回免除される"},
  {name:"晴れ男/女", id:"rain_immune", desc:"「豪雨」でも移動距離が減らない"},
  {name:"追い風マスター", id:"wind_pro", desc:"「追い風」の時、誰よりも多く進める"},
  {name:"逆境に強い雑草魂", id:"strong_mind", desc:"マイナスマスが半減し、逆にお金をもらえる"},
  {name:"普通の部員", id:"none", desc:"特に特殊能力はないが、地道に頑張る"}
];
const conditions = [{n:"絶好調", c:"#00bfff", m:1.5}, {n:"普通", c:"#888", m:1.0}, {n:"スランプ", c:"#9932cc", m:0.5}];
let players = [], turn = 0, isMoving = false, globalTurnCount = 0, rouletteTimer = null, currentWeather = "sunny", numPlayers = 2;

// 💡 流れの変更：人数 → 説明 → 名前＆特性
function startExplanation() {
  numPlayers = parseInt(document.getElementById("player-count-input").value) || 2;
  showRuleBase();
}

function showRuleBase() {
  document.getElementById("flow-title").innerText = "🎾 基本ルールについて";
  document.getElementById("flow-content").innerHTML = `<p>・<b>最終順位：</b>引退時、一番多く「お金」を持っていた人が優勝です。<br>・<b>引退賞金：</b>ゴールするとお祝いとして<b>30,000円</b>もらえます。<br>・<b>定期徴収：</b>10ターンごとに部費集めがあります。最下位以外から<b>3,000円</b>を没収します。</p><button class="big-btn" onclick="showRulePyramid()">次へ：部内の格付け</button>`;
}

function showRulePyramid() {
  document.getElementById("flow-title").innerText = "📊 所持金による「格付け」";
  document.getElementById("flow-content").innerHTML = `<p>所持金に応じて、あなたの称号がリアルタイムで変化します。</p><div class="pyramid-container"><div class="p-row p-1">5万円～：レジェンド</div><div class="p-row p-2">3万円～：エース</div><div class="p-row p-3">1万円～：レギュラー</div><div class="p-row p-4">0円～：平部員</div><div class="p-row p-5">-1万円～：雑用係</div><div class="p-row p-6">それ以下：部の恥</div></div><button class="big-btn" onclick="showRuleTrait()">次へ：特性の選択へ</button>`;
}

function showRuleTrait() {
  document.getElementById("flow-title").innerText = "📝 名前と特性を決めよう";
  let setupHtml = '<div class="setup-grid">';
  for (let i = 0; i < numPlayers; i++) {
    setupHtml += `
      <div class="setup-item">
        <strong>Player ${i+1}</strong><br>
        <input type="text" class="name-input" id="name-${i}" placeholder="部員名を入力">
        <select class="trait-select" id="trait-${i}">
          ${traits.map(t => `<option value="${t.id}">${t.name} (${t.desc})</option>`).join("")}
        </select>
      </div>`;
  }
  setupHtml += '</div><button class="big-btn" onclick="initPlayers()">入部を完了してスタート！</button>';
  document.getElementById("flow-content").innerHTML = setupHtml;
}

function initPlayers() {
  players = [];
  for (let i = 0; i < numPlayers; i++) {
    const name = document.getElementById(`name-${i}`).value || `部員${i+1}`;
    const traitId = document.getElementById(`trait-${i}`).value;
    const trait = traits.find(t => t.id === traitId);
    players.push({
      id: i, name: name, pos: 0, money: 0, goal: false,
      color: `hsl(${i * (360 / numPlayers)}, 70%, 50%)`,
      darkContract: false, hasRevolted: false, trait: trait, condition: conditions[1]
    });
  }
  startGame();
}

function startGame() { document.getElementById("flow-overlay").style.display = "none"; renderBoard(); updateStatus(); }

// --- ゲームロジック ---
let currentRevoltTarget = null;
function showRevolt演出() {
  const p = players[turn]; currentRevoltTarget = [...players].sort((a,b)=>b.money-a.money)[0];
  document.getElementById("revolt-matchup").innerHTML = `挑戦者：<span style="color:${p.color}">${p.name}</span> VS 暫定1位：<span style="color:${currentRevoltTarget.color}">${currentRevoltTarget.name}</span>`;
  document.getElementById("revolt-overlay").style.display = "flex";
}
function startRevoltFight() {
  let count = 3; const msg = document.getElementById("revolt-msg");
  const timer = setInterval(() => { msg.innerText = count + "..."; sounds.dice(); count--;
    if(count < 0) { clearInterval(timer);
      const r1 = Math.floor(Math.random()*6)+1, r2 = Math.floor(Math.random()*6)+1;
      document.getElementById("rev-dice-p1").innerText = "🎲"+r1; document.getElementById("rev-dice-p2").innerText = "🎲"+r2;
      const p = players[turn]; p.hasRevolted = true;
      if(r1 > r2) { msg.innerText = "下剋上成功！"; sounds.ev(); let t = p.pos; p.pos = currentRevoltTarget.pos; currentRevoltTarget.pos = t; renderBoard(); }
      else { msg.innerText = "失敗..."; sounds.bad(); p.money -= 2000; }
      document.getElementById("revolt-go-btn").style.display = "none"; document.getElementById("revolt-close-btn").style.display = "inline-block"; updateStatus();
    }
  }, 800);
}
function finishRevolt演出() { document.getElementById("revolt-overlay").style.display = "none"; }

function checkDarkShop() { const p = players[turn]; if (p.money < 0 && !p.darkContract) showSpecialRule('dark'); else rollDice(); }
function showSpecialRule(t) { document.getElementById("special-rule-overlay").style.display = "flex"; document.getElementById("special-title").innerText = "👿 闇取引"; document.getElementById("special-text").innerText = "契約しますか？サイコロが2個になりますが、ゴール賞金が半分になります。"; document.getElementById("dark-contract-btns").style.display = "block"; document.getElementById("special-understand-btn").style.display = "none"; }
function closeSpecialRule() { document.getElementById("special-rule-overlay").style.display = "none"; rollDice(); }
function acceptDarkContract() { players[turn].darkContract = true; closeSpecialRule(); }

function rollDice() {
  if(isMoving || players[turn].goal) return; isMoving = true; sounds.dice();
  const d = document.getElementById("diceNum"); d.classList.add("rolling");
  setTimeout(() => { d.classList.remove("rolling");
    let p = players[turn]; let step = (Math.floor(Math.random()*6)+1) + (p.darkContract? (Math.floor(Math.random()*6)+1):0);
    if(p.condition.n === "スランプ" || (currentWeather === "rainy" && p.trait.id !== "rain_immune")) step = Math.ceil(step/2);
    if(currentWeather === "windy") step += (p.trait.id === "wind_pro" ? 3 : 2);
    d.innerText = "🎲 " + step; setTimeout(() => move(step), 600);
  }, 800);
}

function move(s) {
  let p = players[turn]; p.pos = Math.min(squares.length-1, p.pos + s);
  if(p.pos === squares.length-1) { p.goal = true; p.money += p.darkContract ? 15000 : 30000; }
  renderBoard(); setTimeout(() => processSquare(p, squares[p.pos]), 300);
}

function processSquare(p, s) {
  if (s.t === "mini") {
    const partner = players.find(pl => pl !== p && Math.abs(pl.pos - p.pos) <= 2);
    if(partner) { p.money += 3000; partner.money += 3000; sounds.ev(); showEvent(p, "🤝 ダブルス協力！", `${partner.name}と協力成功！2人に3000円！`, "#2ecc71"); }
    else { sounds.bad(); showEvent(p, "🔥 現実対決！", "相手がいない！一人で特訓だ！", "#e74c3c"); }
  } else if (s.t === "reward") { startRoulette(p); }
  else {
    let amt = s.m || 0; if (amt < 0 && p.trait.id === "strong_mind") amt = Math.floor(amt/2)+1000;
    if (amt > 0) amt = Math.floor(amt * p.condition.m);
    p.money += amt; amt < 0 ? sounds.bad() : sounds.ev();
    showEvent(p, amt >= 0 ? "👍 ラッキー" : "👎 事件", s.txt + (amt ? `<br>${amt}円` : ""), amt >= 0 ? "#2e8b57" : "#e74c3c");
  }
}

function showEvent(p, t, txt, c) {
  const job = getJobTitle(p.money);
  document.getElementById("ev-player").innerHTML = `<span style="color:${job.color}">${job.title}</span> ${p.name}`;
  document.getElementById("ev-text").innerText = t; document.getElementById("ev-money").innerHTML = txt;
  document.getElementById("event-overlay").style.display = "flex";
}
function closeEvent() { document.getElementById("event-overlay").style.display = "none"; finishTurn(); }

function finishTurn() {
  globalTurnCount++; document.getElementById("turns-left").innerText = 10 - (globalTurnCount % 10);
  if(globalTurnCount % 5 === 0) { 
    players[turn].condition = conditions[Math.floor(Math.random()*conditions.length)];
    if(players[turn].condition.n !== "普通") showAlert(players[turn].name+"が"+players[turn].condition.n+"！");
  }
  if(globalTurnCount % 10 === 0) {
    showAlert("💰 部費徴収！"); sounds.bad();
    const sorted = [...players].sort((a,b)=>a.money-b.money);
    players.forEach(p => { if(p !== sorted[0] && p.trait.id !== "fav") p.money -= 3000; });
  } else if(globalTurnCount % 3 === 0) {
    const r = Math.random(); 
    currentWeather = r < 0.34 ? "sunny" : (r < 0.67 ? "rainy" : "windy");
    let weatherHtml = "";
    if(currentWeather === "sunny") weatherHtml = "☀️ 晴れ";
    else if(currentWeather === "rainy") weatherHtml = "☔ 豪雨 <small>晴れ男/女チャンス！</small>";
    else if(currentWeather === "windy") weatherHtml = "🍃 追い風 <small>ゴールに向かおう！追い風マスターチャンス！</small>";
    document.getElementById("weather-display").innerHTML = weatherHtml;
    showAlert(currentWeather === "sunny" ? "☀️ 晴れ" : (currentWeather === "rainy" ? "☔ 豪雨" : "🍃 追い風"));
  }
  isMoving = false; document.getElementById("diceBtn").disabled = false;
  if(players.every(pl => pl.goal)) showFinalResults();
  else { 
    do { turn = (turn + 1) % players.length; } while(players[turn].goal); 
    updateStatus(); 
    const activeCard = document.querySelector('.active-p');
    if(activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function startRoulette(p) {
  document.getElementById("event-overlay").style.display = "flex"; document.getElementById("roulette-stop").style.display = "inline-block"; document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => { sounds.dice(); document.getElementById("ev-money").innerText = ["+5000円", "+10000円", "🧃 ジュース", "🍪 お菓子"][Math.floor(Math.random()*4)]; }, 100);
}
function stopRoulette() { clearInterval(rouletteTimer); sounds.ev(); document.getElementById("roulette-stop").style.display = "none"; document.getElementById("ev-close").style.display = "inline-block"; }

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => { b.innerHTML += `<div class="square type-${s.t}"><small>${i}</small><br><b>${s.txt}</b><div id="p-at-${i}"></div></div>`; });
  players.forEach(p => { const t = document.createElement("div"); t.className = "token"; t.style.background = p.color; document.getElementById(`p-at-${p.pos}`).appendChild(t); });
}

function updateStatus() {
  document.getElementById("statusArea").innerHTML = players.map((p, i) => {
    const job = getJobTitle(p.money);
    return `<div class="money-card ${i===turn?'active-p':''}">
      <span class="rank-badge" style="background:${job.color}">${job.title}</span>
      <span class="condition-badge" style="background:${p.condition.c}; color:white;">${p.condition.n}</span><br>
      <b style="color:${p.color}">${p.name}</b><br>💰 <b>${p.money}</b>円
      <span class="trait-badge">${p.trait.name}</span>
    </div>`}).join("");
  const low = [...players].sort((a,b)=>a.money-b.money)[0];
  document.getElementById("revolt-btn").style.display = (players[turn] === low && !low.hasRevolted && !low.goal) ? "block" : "none";
}

function showAlert(t) { const a = document.getElementById("big-alert"); a.innerText = t; a.style.display = "block"; setTimeout(() => a.style.display = "none", 2000); }
function getJobTitle(m) { if(m>=50000) return {title:"👑 レジェンド", color:"#ffd700"}; if(m>=30000) return {title:"🎾 エース", color:"#ff4500"}; if(m>=10000) return {title:"💪 レギュラー", color:"#32cd32"}; if(m>=0) return {title:"🎾 平部員", color:"#4682b4"}; if(m>=-10000) return {title:"🧹 雑用係", color:"#8a2be2"}; return {title:"💀 部の恥", color:"#000"}; }

function showFinalResults() {
  document.getElementById("result-overlay").style.display = "flex";
  const sorted = [...players].sort((a,b) => b.money - a.money);
  sorted.forEach((p, i) => {
    const item = document.createElement("div"); item.className = "result-item";
    item.innerHTML = `<span>${i+1}位: ${p.name}</span> 💰<b>${p.money}円</b>`;
    document.getElementById("rank-list").appendChild(item);
    setTimeout(() => { item.style.opacity = 1; item.style.transform = "translateY(0)"; sounds.ev(); }, (i+1) * 600);
  });
}
</script>
</body>
</html>
