<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：レジェンド完全版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --rain: #4682b4; --wind: #f0e68c; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; transition: background 1s; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  #sidebar { flex: 0 0 260px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; overflow-y: auto; }
  .money-card { padding: 10px; border-radius: 10px; background: #fff; border: 3px solid #ddd; margin-bottom: 8px; transition: 0.3s; position: relative; left: 0; }
  .active-p { border-color: #ffde59; transform: scale(1.05); left: 15px; box-shadow: 0 0 15px rgba(255,222,89,0.8); }
  .active-p::before { content: "🎾"; position: absolute; left: -25px; top: 35%; font-size: 18px; }
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  #top-bar { background: white; padding: 10px; border-radius: 15px; display: flex; justify-content: space-around; align-items: center; position: relative; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; position: relative; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; }
  .type-warp { background: #3498db !important; }
  .token { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; display: inline-block; margin: 1px; }
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 999; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.9); }
  .event-card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 80%; max-width: 600px; border: 8px solid var(--green); }
  button { padding: 12px 30px; font-size: 20px; background: var(--green); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
  .rank-item { opacity: 0; transform: translateY(20px); transition: 0.8s; margin: 10px 0; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; width: 80%; }
  .rank-show { opacity: 1; transform: translateY(0); }
  .weather-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; color: white; }
  /* 天気テロップ用 */
  #weather-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: bold; color: white; text-shadow: 0 0 30px rgba(0,0,0,1); z-index: 10000; pointer-events: none; display: none; white-space: nowrap; }
</style>
</head>
<body id="bg-body">

<div id="weather-alert"></div>

<div id="event-overlay" class="full-overlay">
  <div id="ev-card" class="event-card">
    <div id="ev-player" style="font-size:24px; font-weight:bold;"></div>
    <div id="ev-text" style="font-size:40px; font-weight:bold; margin:10px 0;"></div>
    <div id="ev-money" style="font-size:30px; color:var(--red); font-weight:bold;"></div>
    <div id="dark-options" style="display:none; margin-top:20px;">
      <button onclick="acceptDarkContract()" style="background:#4b0082;">契約する（2回振る）</button>
      <button onclick="closeEvent()" style="background:#666; margin-left:10px;">断る</button>
    </div>
    <button id="ev-close" onclick="closeEvent()">次へ進む</button>
    <button id="roulette-stop" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button>
  </div>
</div>

<div id="result-overlay" class="full-overlay" style="background: radial-gradient(circle, #2c3e50, #000);">
  <h1 id="res-title" style="font-size:40px; color:var(--gold);">🏅 最終結果発表 🏅</h1>
  <div id="rank-list" style="display:flex; flex-direction:column; align-items:center; width:100%;"></div>
  <button id="restart-btn" style="margin-top:30px; display:none;" onclick="location.reload()">もう一度部活をやる</button>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center;">部員名簿</h3>
    <div id="statusArea"></div>
    <button id="revolt-btn" onclick="triggerRevolt()" style="width:100%; margin-top:10px; font-size:14px; background:#e67e22; display:none;">💥 審判に異議申し立て</button>
  </div>
  <div id="game-area">
    <div id="top-bar">
      <div id="weather-display" class="weather-badge" style="background:var(--green);">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:40px;">🎲 ?</div>
      <button id="diceBtn" onclick="checkDarkShop()">サイコロを振る</button>
      <div style="font-size:12px; background:var(--red); color:white; padding:5px; border-radius:10px;">徴収まで: <span id="turns-left">10</span></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const squares = [
  {t:"start", txt:"集合"}, {t:"normal", txt:"ラケット粉砕", m:-20000}, {t:"normal", txt:"チャリパンク", m:-2000}, {t:"reward", txt:"ラッキー"},
  {t:"normal", txt:"大会決定", m:5000}, {t:"mini", txt:"★腕相撲"}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"練習", special:"doubles"},
  {t:"normal", txt:"勝利", m:3000}, {t:"reward", txt:"ドリンク"}, {t:"normal", txt:"オフ", m:0}, {t:"mini", txt:"★柔軟"},
  {t:"normal", txt:"筋トレ", m:-1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"迷走", m:-1000}, {t:"reward", txt:"差し入れ"},
  {t:"normal", txt:"大会", special:"doubles"}, {t:"mini", txt:"★素振り"}, {t:"normal", txt:"＋", m:2000}, {t:"warp", txt:"ワープ"},
  {t:"normal", txt:"－", m:-1500}, {t:"normal", txt:"張替", m:-2000}, {t:"reward", txt:"おやつ"}, {t:"mini", txt:"★対決"},
  {t:"normal", txt:"褒誉", m:1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"迷走", m:-1000}, {t:"reward", txt:"部費"},
  {t:"normal", txt:"強打", m:-1000}, {t:"mini", txt:"★フットワーク"}, {t:"normal", txt:"最高", m:2000}, {t:"goal", txt:"引退"}
];
const rewards = ["+5000円", "+20000円", "🧃 ジュース", "🍪 お菓子"];
let players = [], turn = 0, isMoving = false, globalTurnCount = 0, rouletteTimer = null;
let currentWeather = "sunny"; 

window.onload = function() {
  const count = parseInt(prompt("部員は何人？")) || 2;
  for(let i=0; i<count; i++){
    players.push({ id:i, name: prompt((i+1)+"人目の名前")||"部員"+(i+1), pos: 0, money: 0, goal: false, color: `hsl(${i*(360/count)}, 70%, 50%)`, streak: 0, awakened: false, penalty: 0, darkContract: false, hasRevolted: false });
  }
  renderBoard(); updateStatus();
};

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => {
    b.innerHTML += `<div class="square type-${s.t}"><small>${i}</small> <b>${s.txt}</b><div id="p-at-${i}"></div></div>`;
  });
  players.forEach(p => {
    const t = document.createElement("div"); t.className = "token"; t.style.background = p.color;
    document.getElementById(`p-at-${p.pos}`).appendChild(t);
  });
}

function updateStatus() {
  const sorted = [...players].filter(p => !p.goal).sort((a,b)=>a.money-b.money);
  const lowestPlayer = sorted[0];
  document.getElementById("statusArea").innerHTML = players.map((p, i) => `
    <div class="money-card ${i===turn?'active-p':''}">
      <b style="color:${p.color}">${p.name}</b><br>💰 <b>${p.money}</b>円 ${p.darkContract?'<br><small style="color:purple">⚠️契約中</small>':''}
    </div>`).join("");
  const revoltBtn = document.getElementById("revolt-btn");
  if (players[turn] === lowestPlayer && !players[turn].hasRevolted && !players[turn].goal) {
    revoltBtn.style.display = "block";
  } else {
    revoltBtn.style.display = "none";
  }
}

function updateWeather() {
  const rand = Math.random();
  const bg = document.getElementById("bg-body");
  const badge = document.getElementById("weather-display");
  const alertBox = document.getElementById("weather-alert");
  let weatherText = "";

  if (rand < 0.6) {
    currentWeather = "sunny"; bg.style.background = "#1a1a1a";
    badge.innerText = "☀️ 晴れ"; badge.style.background = "var(--green)"; badge.style.color = "white";
    weatherText = "☀️ 晴天";
  } else if (rand < 0.8) {
    currentWeather = "rainy"; bg.style.background = "#001f3f";
    badge.innerText = "☔ 豪雨"; badge.style.background = "var(--rain)"; badge.style.color = "white";
    weatherText = "☔ 豪雨 (ダイス半減)";
  } else {
    currentWeather = "windy"; bg.style.background = "#3d3d00";
    badge.innerText = "🍃 追い風"; badge.style.background = "var(--wind)"; badge.style.color = "#333";
    weatherText = "🍃 追い風 (+2マス)";
  }

  // デカデカと表示
  alertBox.innerText = weatherText;
  alertBox.style.display = "block";
  setTimeout(() => { alertBox.style.display = "none"; }, 2500);
}

function checkDarkShop() {
  const p = players[turn];
  if (p.money < 0 && !p.darkContract) {
    document.getElementById("ev-card").classList.add("dark-shop");
    document.getElementById("ev-close").style.display = "none";
    document.getElementById("dark-options").style.display = "block";
    showEvent(p, "👿 闇のラケットショップ", "契約するか？<br><small>効果：サイコロ2個。引退賞金半分。</small>", "#4b0082", false);
  } else {
    rollDice();
  }
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  isMoving = true;
  document.getElementById("diceBtn").disabled = true;
  let dice1 = Math.floor(Math.random() * 6) + 1;
  let total = dice1 + (players[turn].darkContract ? Math.floor(Math.random() * 6) + 1 : 0);
  if (currentWeather === "rainy") total = Math.ceil(total / 2);
  if (currentWeather === "windy") total += 2;
  document.getElementById("diceNum").innerText = "🎲 " + total;
  setTimeout(() => move(total), 600);
}

function move(steps) {
  let p = players[turn];
  p.pos = Math.min(squares.length - 1, p.pos + steps);
  if(p.pos === squares.length - 1) {
      p.goal = true;
      p.money += p.darkContract ? 15000 : 30000;
  }
  renderBoard(); 
  processSquare(p, squares[p.pos]);
}

function processSquare(p, s) {
  if (s.t === "mini") showEvent(p, "🔥 現実対決！", s.txt, "#e74c3c", true);
  else if (s.t === "reward") startRoulette(p);
  else if (s.t === "warp") {
    p.pos = Math.max(0, p.pos + (Math.random() > 0.5 ? 3 : -3));
    showEvent(p, "🌀 ワープ", "移動しました", "#3498db", true);
    renderBoard();
  } else {
    p.money += s.m || 0;
    showEvent(p, s.m >= 0 ? "👍 出来事" : "👎 事件", s.txt + (s.m ? `<br>${s.m}円` : ""), s.m >= 0 ? "#2e8b57" : "#e74c3c", true);
  }
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  document.getElementById("ev-card").classList.remove("dark-shop");
  document.getElementById("dark-options").style.display = "none";
  finishTurn();
}

function finishTurn() {
  isMoving = false; 
  document.getElementById("diceBtn").disabled = false;
  globalTurnCount++;
  document.getElementById("turns-left").innerText = 10 - (globalTurnCount % 10);
  if(globalTurnCount % 3 === 0) updateWeather();
  if(globalTurnCount % 10 === 0) alert("💰 部費徴収タイム！最下位以外-3000円！");
  updateStatus();
  if(players.every(pl => pl.goal)) showFinalResults();
  else { do { turn = (turn + 1) % players.length; } while(players[turn].goal); updateStatus(); }
}

function showEvent(p, title, text, color, hasButton) {
  document.getElementById("ev-player").innerText = p.name;
  document.getElementById("ev-text").innerHTML = title;
  document.getElementById("ev-money").innerHTML = text;
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("ev-close").style.display = hasButton ? "inline-block" : "none";
}

function startRoulette(p) {
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "inline-block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => {
    document.getElementById("ev-money").innerText = rewards[Math.floor(Math.random() * rewards.length)];
  }, 50);
}

function stopRoulette() {
  clearInterval(rouletteTimer);
  const res = document.getElementById("ev-money").innerText;
  if(res.includes("円")) players[turn].money += parseInt(res.replace(/[^0-9]/g, ""));
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
}

function acceptDarkContract() {
  players[turn].darkContract = true;
  document.getElementById("dark-options").style.display = "none";
  document.getElementById("ev-card").classList.remove("dark-shop");
  document.getElementById("event-overlay").style.display = "none";
  rollDice();
}

function triggerRevolt() {
  const p = players[turn];
  const sorted = [...players].sort((a,b)=>b.money-a.money);
  const target = sorted[0];
  p.hasRevolted = true;
  alert(`💥 下剋上！1位の ${target.name} と場所を賭けて勝負！`);
  const r1 = Math.floor(Math.random() * 6) + 1;
  const r2 = Math.floor(Math.random() * 6) + 1;
  alert(`${p.name}: ${r1} VS ${target.name}: ${r2}`);
  if (r1 > r2) {
    alert("勝利！場所を入れ替えます！");
    let tPos = p.pos; p.pos = target.pos; target.pos = tPos;
    renderBoard();
  } else {
    alert("失敗... 罰金2000円"); p.money -= 2000;
  }
  updateStatus();
}

function showFinalResults() {
  document.getElementById("result-overlay").style.display = "flex";
  const sorted = [...players].sort((a,b) => b.money - a.money);
  sorted.forEach((p, i) => {
    const item = document.createElement("div");
    item.className = "rank-item";
    item.innerHTML = `<span>${i+1}位: ${p.name}</span><b>${p.money}円</b>`;
    document.getElementById("rank-list").appendChild(item);
    setTimeout(() => { item.classList.add("rank-show"); if(i===0) document.getElementById("restart-btn").style.display="block"; }, (sorted.length - i) * 1000);
  });
}
</script>
</body>
</html>
