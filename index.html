<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：絵文字完全復元版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  .explain-card { background: white; color: #333; padding: 30px; border-radius: 30px; border: 8px solid var(--green); max-width: 850px; width: 95%; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  
  button.big-btn { font-size: 18px; padding: 12px 30px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 4px 0 #1b5e38; transition: 0.1s; margin: 5px; }
  button.big-btn:active { transform: translateY(2px); box-shadow: none; }

  #sidebar { flex: 0 0 260px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 10px; border-radius: 8px; background: #fff; border: 2px solid #ddd; margin-bottom: 6px; position: relative; }
  .active-p { border-color: #ffde59 !important; background: #fffde0 !important; transform: scale(1.03); border-width: 4px; }
  
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; padding: 4px; font-size: 10px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
  .token-emoji { font-size: 26px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); display: inline-block; transition: 0.3s; }

  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
  .setup-item { background: #f0f0f0; padding: 10px; border-radius: 10px; text-align: left; }
  .setup-item input { width: 45px; }
  .setup-item input.name-in { width: 80px; }
</style>
</head>
<body>

<div id="msg-overlay" class="full-overlay">
  <div class="explain-card">
    <div id="msg-title" style="font-size:32px; font-weight:bold;"></div>
    <div id="msg-player-icon" style="font-size:80px; margin:10px 0;"></div>
    <div id="msg-body" style="font-size:20px; margin:20px 0; line-height:1.5;"></div>
    <button class="big-btn" onclick="hideMsg()">了解！</button>
  </div>
</div>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card">
    <h2 style="color:var(--green);">🎾 部員名簿・絵文字設定</h2>
    <div id="flow-content">
      <p>人数を入力してください</p>
      <input type="number" id="p-count" value="14" style="font-size:24px; width:70px; text-align:center;">
      <br><button class="big-btn" onclick="showSetup()">次へ：個別に設定</button>
    </div>
  </div>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:5px;">部員名簿</h3>
    <div id="statusArea"></div>
  </div>
  <div id="game-area" style="flex:1; display:flex; flex-direction:column; gap:8px;">
    <div id="top-bar" style="background:white; padding:15px; border-radius:15px; display:flex; justify-content:space-around; align-items:center;">
      <div id="weather-ui" style="font-size:22px; font-weight:bold;">☀️ 晴れ</div>
      <div style="text-align:center;">
        <div id="diceNum" style="font-size:60px; font-weight:bold; color:var(--green);">🎲</div>
        <div id="bonus-desc" style="font-size:12px; height:15px; color:var(--red);"></div>
      </div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const traits = [
    {id:"none", n:"普通の部員"},
    {id:"fav", n:"顧問の愛弟子"},
    {id:"sun", n:"晴れ男/女"},
    {id:"wind", n:"追い風マスタ"},
    {id:"strong", n:"雑草魂"}
];
const squares = [{t:"start", txt:"集合"}, {t:"normal", txt:"ラケット破損", m:-4000}, {t:"normal", txt:"部室掃除", m:500}, {t:"reward", txt:"😁"}, {t:"normal", txt:"遠征", m:-2000}, {t:"normal", txt:"練習試合勝利", m:5000}, {t:"normal", txt:"ガット切れ", m:-2500}, {t:"reward", txt:"😁"}, {t:"normal", txt:"エース覚醒", m:8000}, {t:"goal", txt:"引退"}];
const weathers = [{n:"晴れ", i:"☀️"}, {n:"雨", i:"☔"}, {n:"強風", i:"🌀"}];

let players = [], turn = 0, weatherIdx = 0, globalTurn = 0, isRolling = false;

function showSetup() {
    const count = document.getElementById("p-count").value;
    let html = '<div class="setup-grid">';
    for(let i=1; i<=count; i++) {
        html += `<div class="setup-item">
            #${i} <input id="n-${i}" class="name-in" placeholder="名前"> 
            <input id="e-${i}" placeholder="絵文字" value="🎾">
            <select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select>
        </div>`;
    }
    html += '</div><button class="big-btn" onclick="initGame()">試合開始！</button>';
    document.getElementById("flow-content").innerHTML = html;
}

function initGame() {
    const count = document.getElementById("p-count").value;
    for(let i=1; i<=count; i++) {
        players.push({
            name: document.getElementById(`n-${i}`).value || `部員${i}`,
            emoji: document.getElementById(`e-${i}`).value || "🎾",
            trait: traits.find(t=>t.id===document.getElementById(`t-${i}`).value),
            pos: 0, money: 5000, goal: false
        });
    }
    document.getElementById("flow-overlay").style.display = "none";
    render();
}

function showMsg(title, icon, body, cb) {
    document.getElementById("msg-title").innerText = title;
    document.getElementById("msg-player-icon").innerText = icon;
    document.getElementById("msg-body").innerHTML = body;
    document.getElementById("msg-overlay").style.display = "flex";
    window._cb = cb;
}
function hideMsg() {
    document.getElementById("msg-overlay").style.display = "none";
    if(window._cb) window._cb();
}

function rollDice() {
    if(isRolling) return; isRolling = true;
    const p = players[turn];
    const diceDiv = document.getElementById("diceNum");
    const bonusDiv = document.getElementById("bonus-desc");
    bonusDiv.innerText = "";
    
    let count = 0;
    const timer = setInterval(() => {
        diceDiv.innerText = ["⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)];
        if(++count > 15) {
            clearInterval(timer);
            let base = Math.floor(Math.random()*6)+1;
            let final = base;
            let w = weathers[weatherIdx].n;
            
            if(w==="晴れ" && p.trait.id==="sun") { final++; bonusDiv.innerText = "特性ボーナス +1"; }
            if(w==="強風" && p.trait.id==="wind") { final++; bonusDiv.innerText = "特性ボーナス +1"; }
            if(w==="雨") {
                if(p.trait.id!=="strong") { final = Math.max(1, final-1); bonusDiv.innerText = "雨の減速 -1"; }
                else { bonusDiv.innerText = "雑草魂で減速なし！"; }
            }

            diceDiv.innerHTML = `${["⚀","⚁","⚂","⚃","⚄","⚅"][base-1]} <span style="font-size:75px;">${final}</span>`;
            setTimeout(() => move(final), 800);
        }
    }, 60);
}

function move(s) {
    let p = players[turn];
    p.pos = Math.min(squares.length-1, p.pos + s);
    render();
    setTimeout(() => {
        const sq = squares[p.pos];
        if(sq.t === "reward") {
            p.money += 3000;
            showMsg("😁 ラッキー！", p.emoji, `${p.name}にアイスの差し入れ！<br>+3000円`, endTurn);
        } else if(sq.m) {
            let amt = (sq.m < 0 && p.trait.id === "strong") ? Math.floor(sq.m/2) : sq.m;
            p.money += amt;
            showMsg(amt>0?"👍 ナイス！":"👎 事件...", p.emoji, `${sq.txt}<br>${amt}円`, endTurn);
        } else { endTurn(); }
    }, 400);
}

function endTurn() {
    globalTurn++;
    if(globalTurn % 10 === 0) {
        let victims = players.filter(pl => !pl.goal && pl.trait.id !== "fav").map(pl => { pl.money -= 2000; return pl.emoji + pl.name; });
        showMsg("💰 部費徴収！", "💸", `徴収(-2000円):<br>${victims.join("<br>")}`, nextP);
    } else if(globalTurn % 3 === 0) {
        weatherIdx = (weatherIdx + 1) % weathers.length;
        const w = weathers[weatherIdx];
        showMsg(`${w.i} 天候変化`, w.i, `天気が「${w.n}」に変わりました！`, nextP);
    } else { nextP(); }
}

function nextP() {
    isRolling = false;
    do { turn = (turn + 1) % players.length; } while(players[turn].goal);
    document.getElementById("weather-ui").innerText = weathers[weatherIdx].i + " " + weathers[weatherIdx].n;
    document.getElementById("diceNum").innerText = "🎲";
    document.getElementById("bonus-desc").innerText = "";
    render();
}

function render() {
    document.getElementById("statusArea").innerHTML = players.map((p,i) => `
        <div class="money-card ${i===turn?'active-p':''}">
            <span style="font-size:24px;">${p.emoji}</span> <b>${p.name}</b><br>
            💰 ${p.money}円 <small>(${p.trait.n})</small>
        </div>`).join("");
    const b = document.getElementById("board"); b.innerHTML = "";
    squares.forEach((s,i) => {
        b.innerHTML += `<div class="square"><small>${i}</small><b>${s.txt}</b><div id="p-box-${i}"></div></div>`;
    });
    players.forEach(p => {
        const span = document.createElement("span"); span.className="token-emoji"; span.innerText=p.emoji;
        document.getElementById(`p-box-${p.pos}`).appendChild(span);
    });
}
</script>
</body>
</html>
