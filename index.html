<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>女子テニス部人生ゲーム：祝卒業🌸</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --pink: #ff69b4; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 5px; box-sizing: border-box; gap: 5px; }
  
  #sidebar { flex: 0 0 320px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow-y: auto; scroll-behavior: smooth; }
  #statusArea { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  
  .money-card { padding: 6px; border-radius: 8px; background: #fff; border: 2px solid #ddd; position: relative; overflow: hidden; font-size: 11px; transition: 0.3s; }
  .active-p { border-color: var(--pink); background: #fff5f8; transform: scale(1.02); z-index: 2; box-shadow: 0 0 10px rgba(255,105,180,0.3); }
  .skip-label { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(231, 76, 60, 0.6); color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; z-index: 5; }

  #game-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; position: relative; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }

  .token-emoji { font-size: 20px; position: absolute; z-index: 10; animation: bounce 1s infinite; transition: 0.5s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 9999; background: rgba(0,0,0,0.8); flex-direction: column; }
  .event-card { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 500px; border: 8px solid var(--pink); text-align: center; }

  #result-overlay { opacity: 0; display: none; animation: fuwatto 2.5s ease-out forwards; }
  @keyframes fuwatto { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
  button.big-btn { padding: 12px 30px; font-size: 18px; background: var(--pink); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; margin: 5px; }
  
  .pyramid { font-family: monospace; white-space: pre; line-height: 1.2; background: #eee; padding: 10px; border-radius: 10px; display: inline-block; text-align: center; }
</style>
</head>
<body>

<div id="start-overlay">
  <div class="scroll-card" id="setup-content" style="background:white; padding:30px; border-radius:30px; max-width:800px; width:90%; color:#333; overflow-y:auto; max-height:90vh;">
    <h1 style="color:var(--pink); text-align:center;">🎾 女子テニス部人生ゲーム 🎾</h1>
    <div style="text-align:center;">
      人数を入力してください (最大14人): <br>
      <input type="number" id="p-count" value="4" min="1" max="14" style="font-size:24px; width:80px; text-align:center; margin:15px;">
      <br><button class="big-btn" onclick="generateSetup()">部員登録へ</button>
    </div>
  </div>
</div>

<div id="event-overlay" class="full-overlay">
  <div class="event-card">
    <div id="ev-player" style="font-size:20px; color:var(--pink); font-weight:bold;"></div>
    <div id="ev-text" style="font-size:24px; font-weight:bold; margin:15px 0;"></div>
    <div id="trade-ui" style="display:none;">
      相手: <select id="trade-target-select" style="font-size:18px;"></select>
      <br>
      <button class="big-btn" style="background:#444;" onclick="executeTrade()">契約する</button>
      <button class="big-btn" style="background:#888;" onclick="closeEvent()">断って自力で振る</button>
    </div>
    <div id="gekokujo-roll" style="display:none; font-size:40px;">🎲 ? VS 🎲 ?</div>
    <div id="button-area">
      <button id="ev-close" class="big-btn" onclick="closeEvent()">了解</button>
    </div>
    <button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button>
  </div>
</div>

<div id="result-overlay" class="full-overlay">
  <h1 style="font-size:40px; color:var(--gold);">🏅 引退式 🏅</h1>
  <div id="rank-list"></div>
  <button class="big-btn" onclick="location.reload()">もう一度</button>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; color:var(--pink); margin:5px;">🎀 部員名簿</h3>
    <div id="statusArea"></div>
    <button id="revolt-btn" class="big-btn" style="background:#e67e22; font-size:12px; margin-top:10px; display:none;" onclick="triggerGekokujo()">💥 下剋上</button>
  </div>
  <div id="game-area">
    <div style="display:flex; justify-content:space-around; align-items:center; background:#fff; padding:10px; border-radius:10px;">
      <div id="weather-display" style="padding:5px 15px; border-radius:20px; background:var(--green); color:white; font-weight:bold;">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:40px;">🎲 ?</div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
let players = [], turn = 0, isMoving = false, rouletteTimer = null, currentWeather = {id:"sunny", n:"☀️ 晴れ"};
const traits = [
  {id:"fav", n:"顧問の愛弟子", bonus: (p, w) => 1},
  {id:"sun", n:"晴れ女", bonus: (p, w) => w.id === "sunny" ? 2 : 0},
  {id:"wind", n:"追い風マスタ", bonus: (p, w) => w.id === "windy" ? 2 : 0},
  {id:"strong", n:"雑草魂", bonus: (p, w) => w.id === "rainy" ? 2 : 0},
  {id:"none", n:"普通の部員", bonus: (p, w) => 0}
];
const weathers = [{id:"sunny", n:"☀️ 晴れ"}, {id:"rainy", n:"☔ 豪雨"}, {id:"windy", n:"🍃 追い風"}];

const squares = [
  {t:"start", txt:"入学！", m:0}, {t:"normal", txt:"ガット張替え。地味に高いんだyo", m:-2000}, {t:"normal", txt:"練習し過ぎで疲労骨折。", move:-3, m:-5000},
  {t:"reward", txt:"😁ボーナス", m:0}, {t:"normal", txt:"おばちゃんから苦情。我慢しろよー", m:-3000, taxAll:true}, {t:"normal", txt:"福田行く途中にチャリパンク。", m:-4000, skip:true},
  {t:"normal", txt:"スマッシュでラケットふっとばして破壊。", m:-15000}, {t:"normal", txt:"午前授業が始まる。部活が長過ぎる", m:-1000}, {t:"normal", txt:"ラインにつまずいてローリングズッコケ。", m:1000},
  {t:"normal", txt:"中国大会！", move:5, m:-10000}, {t:"normal", txt:"試合に向けてお守りをもらう！", move:3, m:2000}, {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"前髪終了。", move:-1, m:-500}, {t:"normal", txt:"スコアのポイントプラス！", m:3000}, {t:"normal", txt:"雨で部活オフ！", move:2, m:1500},
  {t:"normal", txt:"靴から無限に砂。", move:-1, m:-200}, {t:"normal", txt:"ボレーミスって顔面にボール直撃。", m:-2000, skip:true}, {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"先輩から怒られる。", move:-2, m:-1000}, {t:"normal", txt:"顧問機嫌ワルワルモード。", m:-5000}, {t:"normal", txt:"練習中に雪！テンションマックス", move:4, m:2000},
  {t:"normal", txt:"おしゃべりタイム。", m:1000}, {t:"normal", txt:"調子が絶好調！", move:2, m:3000}, {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"ボールホルダー忘れ。結構最悪", move:-2, m:-500}, {t:"normal", txt:"応援で喉枯れる。ガラガラだー", m:-1000}, {t:"normal", txt:"日焼け止め塗っても真っ黒！激おこ。", m:-1500},
  {t:"normal", txt:"汗で服の色変わっちゃった。", move:-1, m:-1000}, {t:"normal", txt:"日に日に増える5分間走。キツすぎー", move:-2, m:-2000}, {t:"normal", txt:"写真写り最悪。しかもブログに上げるとかやめてもらって？", m:-2000},
  {t:"normal", txt:"日焼け止め忘れたーけど、貸してもらったにょ。ガチサンキュー。", move:6, m:5000}, {t:"goal", txt:"引退", m:10000}
];

function generateSetup() {
  const count = parseInt(document.getElementById("p-count").value);
  let html = `<h2 style="color:var(--pink); text-align:center;">部員設定</h2><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px;">`;
  const emojis = ["🎾","🎀","💄","🍦","🌸","⭐","🔥","💧","🍀","🌙","☀️","🌈","🐾","🎨"];
  for(let i=0; i<count; i++) html += `<div style="background:#fff0f5; padding:5px; border-radius:5px; font-size:12px; border:1px solid var(--pink);">#${i+1} 名前:<input id="n-${i}" style="width:60px;" value="部員${i+1}"><br>特性:<select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select></div>`;
  html += `</div><button class="big-btn" style="margin-top:20px;" onclick="confirmSetup(${count})">次へ：ルール確認</button>`;
  document.getElementById("setup-content").innerHTML = html;
}

function confirmSetup(count) {
  players = [];
  const emojis = ["🎾","🎀","💄","🍦","🌸","⭐","🔥","💧","🍀","🌙","☀️","🌈","🐾","🎨"];
  for(let i=0; i<count; i++) {
    players.push({id:i, name:document.getElementById(`n-${i}`).value, emoji:emojis[i%14], pos:0, money:0, goal:false, trait:traits.find(tr=>tr.id===document.getElementById(`t-${i}`).value), skip:false});
  }
  showRules();
}

function showRules() {
  document.getElementById("setup-content").innerHTML = `
    <h2 style="color:var(--pink); text-align:center;">🎾 ルール説明</h2>
    <div style="font-size:13px; text-align:left; line-height:1.4;">
      1.ゴール時に一番お金を持っていた人が優勝です！<br>
      2.所持金0円からスタートします。<br>
      3.特性と天気の組み合わせで移動距離にボーナスが付きます。<br>
      4.サイコロを振るたびに天気が変わります。<br>
      5.連帯責任で全員からお金が引かれるマスがあります。<br>
      6.赤い枠は一回休みです。<br>
      7.所持金マイナス時は「闇取引」で救済あり。<br>
      8.「下剋上」ボタンで1位と位置を交代できます。<br>
      9.ボーナスマスはルーレットです。<br>
      10.引退式はふわっと表示されます。
    </div>
    <div style="text-align:center; margin:10px 0;">
      <small>【部内ランクの仕組み】</small><br>
      <div class="pyramid">
    　　▲
    　 [エース] (1位)
    　[正レギュラー] (2-3位)
     [補欠・玉拾い] (4位以下)
      </div>
    </div>
    <div style="text-align:center;"><button class="big-btn" style="margin-top:5px;" onclick="initGame()">部活開始！</button></div>`;
}

function initGame() { document.getElementById("start-overlay").style.display="none"; renderBoard(); updateStatus(); }

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => b.innerHTML += `<div class="square type-${s.t}" id="sq-${i}"><small>${i}</small><br><b>${s.txt}</b></div>`);
  players.forEach(p => {
    const t = document.createElement("span"); t.className = "token-emoji"; t.innerText = p.emoji;
    document.getElementById(`sq-${p.pos}`).appendChild(t);
    t.style.left = (p.id * 4) + "px"; t.style.top = (p.id % 2 * 10) + "px";
  });
}

function updateStatus() {
  const sorted = [...players].sort((a,b)=>b.pos - a.pos);
  const statusArea = document.getElementById("statusArea");
  statusArea.innerHTML = players.map((p, i) => {
    const rankIdx = sorted.indexOf(p) + 1;
    let rankName = rankIdx === 1 ? "🏆エース" : (rankIdx <= 3 ? "🥈正ﾚｷﾞｭﾗｰ" : "🌱補欠");
    return `
    <div class="money-card ${i===turn?'active-p':''}" id="card-${i}">
      ${p.skip?'<div class="skip-label">❌ 休み</div>':''}
      <small>${rankName}</small><br>
      <b>${p.emoji}${p.name}</b><br>💰${p.money.toLocaleString()}
    </div>`;
  }).join("");
  
  document.getElementById("revolt-btn").style.display = (players[turn]!==sorted[0] && !players[turn].goal)?"block":"none";

  const activeCard = document.getElementById(`card-${turn}`);
  if (activeCard) {
    const sidebar = document.getElementById("sidebar");
    sidebar.scrollTop = activeCard.offsetTop - sidebar.offsetTop - 10;
  }
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  if(players[turn].money < 0) { triggerTradeUI(); return; }
  
  if(players[turn].skip) {
    players[turn].skip = false;
    showEvent(players[turn], "休み明け", "部活に復帰した！");
    return;
  }
  
  isMoving = true; document.getElementById("diceBtn").disabled = true;
  
  // 天気の自動変更（確認ボタンなし）
  currentWeather = weathers[Math.floor(Math.random()*weathers.length)];
  document.getElementById("weather-display").innerText = currentWeather.n;

  let count = 0;
  const timer = setInterval(() => {
    document.getElementById("diceNum").innerText = "🎲 " + (Math.floor(Math.random()*6)+1);
    if(++count > 10) {
      clearInterval(timer);
      let dice = Math.floor(Math.random()*6)+1;
      
      // 特性と天気のボーナス計算
      let bonus = players[turn].trait.bonus(players[turn], currentWeather);
      let totalSteps = dice + bonus;
      
      let msg = `🎲 ${dice}`;
      if(bonus > 0) msg += ` + 特性ボーナス ${bonus}`;
      document.getElementById("diceNum").innerText = msg;
      
      setTimeout(() => movePlayer(totalSteps), 800);
    }
  }, 60);
}

function movePlayer(steps) {
  let p = players[turn]; p.pos = Math.min(squares.length-1, p.pos + steps);
  renderBoard(); const s = squares[p.pos];
  if(s.t === "reward") startRoulette();
  else if(s.taxAll) { players.forEach(pl => { if(!pl.goal) pl.money -= 3000; }); showEvent(p, "連帯", s.txt+"<br>全員-3000円"); }
  else {
    p.money += s.m; if(s.skip) p.skip = true;
    if(s.move) { p.pos = Math.max(0, Math.min(squares.length-1, p.pos+s.move)); setTimeout(renderBoard, 500); }
    showEvent(p, "移動", s.txt + `<br>💰${s.m.toLocaleString()}円`);
  }
}

function showEvent(p, title, text) {
  document.getElementById("ev-player").innerText = p.emoji + " " + p.name;
  document.getElementById("ev-text").innerHTML = text;
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("ev-close").style.display = "inline-block";
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  document.getElementById("trade-ui").style.display = "none";
  document.getElementById("gekokujo-roll").style.display = "none";
  if(players[turn].pos === squares.length-1) players[turn].goal = true;
  isMoving = false; document.getElementById("diceBtn").disabled = false;
  if(players.every(pl => pl.goal)) showResults();
  else { do { turn = (turn + 1) % players.length; } while(players[turn].goal); updateStatus(); }
}

function startRoulette() {
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("ev-close").style.display = "none";
  document.getElementById("roulette-stop").style.display = "inline-block";
  rouletteTimer = setInterval(() => { document.getElementById("ev-text").innerText = ["💰5000円","💰10000円","お菓子","お菓子"][Math.floor(Math.random()*4)]; }, 50);
}

function stopRoulette() {
  clearInterval(rouletteTimer);
  players[turn].money += parseInt(document.getElementById("ev-text").innerText.match(/\d+/) || 0);
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
}

function triggerTradeUI() {
  const p = players[turn];
  const others = players.filter(t => t !== p && !t.goal && t.money >= 3000);
  const sel = document.getElementById("trade-target-select");
  sel.innerHTML = others.length > 0 ? others.map(t => `<option value="${t.id}">${t.name}</option>`).join("") : `<option value="og">謎のOG</option>`;
  document.getElementById("trade-ui").style.display = "block";
  document.getElementById("ev-close").style.display = "none";
  showEvent(p, "闇取引", "3000円で3マス進む？<br><small>借金中のため救済措置です</small>");
}

function executeTrade() {
  const p = players[turn]; const tid = document.getElementById("trade-target-select").value;
  p.money -= 3000; if(tid !== "og") players[tid].money += 3000;
  p.pos = Math.min(squares.length-1, p.pos + 3); renderBoard(); closeEvent();
}

function triggerGekokujo() {
  const p = players[turn], ace = [...players].sort((a,b)=>b.pos - a.pos)[0];
  document.getElementById("gekokujo-roll").style.display = "block";
  document.getElementById("ev-close").style.display = "none";
  showEvent(p, "💥 下剋上", `${ace.name}に挑む！`);
  let c = 0; const t = setInterval(() => {
    document.getElementById("gekokujo-roll").innerText = `🎲 ${Math.floor(Math.random()*6)+1} VS 🎲 ${Math.floor(Math.random()*6)+1}`;
    if(++c > 15) {
      clearInterval(t); const r1 = Math.floor(Math.random()*6)+1, r2 = Math.floor(Math.random()*6)+1;
      document.getElementById("gekokujo-roll").innerText = `🎲 ${r1} VS ${r2}`;
      setTimeout(() => {
        if(r1 > r2) { [p.pos, ace.pos] = [ace.pos, p.pos]; showEvent(p, "成功すごいじゃーん✨️", "位置を交代！"); }
        else { p.money -= 3000; showEvent(p, "失敗　どんまーい😁切り替えましょうね！", "罰金3000円"); }
        renderBoard();
        document.getElementById("ev-close").style.display = "inline-block";
      }, 800);
    }
  }, 60);
}

function showResults() {
  document.getElementById("result-overlay").style.display = "flex";
  const sorted = [...players].sort((a,b) => b.money - a.money);
  document.getElementById("rank-list").innerHTML = sorted.map((p, i) => `<div style="background:white; margin:5px; padding:10px; border-radius:10px; color:#333;">${i+1}位: ${p.emoji}${p.name} 💰${p.money.toLocaleString()}</div>`).join("");
}
</script>
</body>
</html>
