<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：真・完全版（ご褒美＆説明復活）</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  .explain-card { background: white; color: #333; padding: 30px; border-radius: 30px; border: 8px solid var(--green); max-width: 850px; width: 95%; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  
  button.big-btn { font-size: 18px; padding: 12px 30px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 4px 0 #1b5e38; transition: 0.1s; margin: 5px; }
  button.big-btn:active { transform: translateY(2px); box-shadow: none; }
  button.warn-btn { background: var(--red); box-shadow: 0 4px 0 #900; }
  button.dark-btn { background: #444; box-shadow: 0 4px 0 #222; }
  button.gold-btn { background: var(--gold); color: #333; box-shadow: 0 4px 0 #b8860b; }

  #sidebar { flex: 0 0 260px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 8px; border-radius: 8px; background: #fff; border: 2px solid #ddd; margin-bottom: 5px; }
  .active-p { border-color: #ffde59 !important; background: #fffde0 !important; border-width: 4px; }
  
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; overflow-y: auto; }
  .square { background: var(--green); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; padding: 4px; font-size: 9px; min-height: 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; color: white !important; }
  .token-emoji { font-size: 22px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); transition: 0.3s; }

  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
</style>
</head>
<body>

<div id="msg-overlay" class="full-overlay">
  <div class="explain-card">
    <div id="msg-title" style="font-size:28px; font-weight:bold;"></div>
    <div id="msg-player-icon" style="font-size:60px; margin:10px 0;"></div>
    <div id="msg-body" style="font-size:18px; margin:20px 0; line-height:1.4;"></div>
    <div id="roulette-box" style="font-size:40px; font-weight:bold; color:var(--red); margin:10px 0; display:none;"></div>
    <button id="msg-ok-btn" class="big-btn" onclick="hideMsg()">了解！</button>
    <button id="roulette-stop-btn" class="big-btn gold-btn" style="display:none;" onclick="stopRewardRoulette()">ストップ！</button>
  </div>
</div>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card">
    <h2 style="color:var(--green);">🎾 テニス部人生ゲーム：完全復活版</h2>
    <div id="flow-content">
      <div style="text-align:left; background:#f9f9f9; padding:15px; border-radius:15px; margin-bottom:15px;">
        <p><b>【基本ルール】</b><br>
        ・10ターン毎に「部費徴収(-2000円)」が発生。<br>
        ・3ターン毎に「天気が変化」し、特性に影響が出る。<br>
        ・所持金マイナスで「闇取引」解禁、いつでも「下剋上」可能！</p>
      </div>
      <p>人数を入力してください（最大20人）</p>
      <input type="number" id="p-count" value="14" style="font-size:24px; width:70px; text-align:center;">
      <br><button class="big-btn" onclick="showSetup()">次へ：個別に設定</button>
    </div>
  </div>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:5px;">部員名簿</h3>
    <div id="statusArea"></div>
  </div>
  <div id="game-area" style="flex:1; display:flex; flex-direction:column; gap:8px;">
    <div id="top-bar" style="background:white; padding:10px; border-radius:15px; display:flex; justify-content:space-around; align-items:center;">
      <div id="weather-ui" style="font-size:20px; font-weight:bold;">☀️ 晴れ</div>
      <div style="text-align:center;">
        <div id="diceNum" style="font-size:50px; font-weight:bold; color:var(--green);">🎲</div>
        <div id="bonus-desc" style="font-size:12px; height:15px; color:var(--red); font-weight:bold;"></div>
      </div>
      <div id="control-panel">
        <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロ</button>
        <button id="gekoBtn" class="big-btn warn-btn" onclick="triggerGekokujo()">下剋上</button>
        <button id="tradeBtn" class="big-btn dark-btn" onclick="triggerTrade()" style="display:none;">闇取引</button>
      </div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const traits = [
    {id:"none", n:"普通の部員", d:"特になし"},
    {id:"fav", n:"顧問の愛弟子", d:"部費徴収を免除"},
    {id:"sun", n:"晴れ男/女", d:"晴れの時サイコロ+1"},
    {id:"wind", n:"追い風マスタ", d:"強風の時サイコロ+1"},
    {id:"strong", n:"雑草魂", d:"雨の影響なし＆支払い半分"}
];

const squares = [
    {t:"start", txt:"集合"}, {t:"normal", txt:"ラケット忘れた", m:-3000}, {t:"normal", txt:"ガット切れた", m:-2000}, {t:"reward", txt:"😁"}, 
    {t:"normal", txt:"部室で小銭発見", m:500}, {t:"mini", txt:"☠対決"}, {t:"normal", txt:"猛特訓", m:1000}, {t:"normal", txt:"球拾い", m:-500}, 
    {t:"normal", txt:"練習試合勝利", m:5000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"休み", m:0}, {t:"mini", txt:"☠対決"}, 
    {t:"normal", txt:"筋トレ", m:-500}, {t:"normal", txt:"朝練遅刻", m:-1000}, {t:"normal", txt:"絶好調", m:3000}, {t:"reward", txt:"😁"}, 
    {t:"normal", txt:"遠征遠い", m:-2500}, {t:"mini", txt:"☠対決"}, {t:"normal", txt:"臨時ボーナス", m:4000}, {t:"normal", txt:"掃除当番", m:200}, 
    {t:"normal", txt:"忘れ物届く", m:1000}, {t:"normal", txt:"グリップ巻替", m:-800}, {t:"reward", txt:"😁"}, {t:"mini", txt:"☠対決"}, 
    {t:"normal", txt:"県大会出場", m:10000}, {t:"normal", txt:"雨天中止", m:0}, {t:"normal", txt:"居残り練習", m:500}, {t:"reward", txt:"😁"}, 
    {t:"normal", txt:"空振り", m:-1000}, {t:"mini", txt:"☠対決"}, {t:"normal", txt:"エース覚醒", m:8000}, {t:"goal", txt:"引退"}
];

const weathers = [
    {n:"晴れ", i:"☀️", d:"「晴れ男/女」のサイコロが+1！"},
    {n:"雨", i:"☔", d:"全員サイコロ-1！「雑草魂」は影響なし！"},
    {n:"強風", i:"🌀", d:"「追い風マスタ」のサイコロが+1！"}
];

let players = [], turn = 0, weatherIdx = 0, globalTurn = 0, isRolling = false, rouletteInterval;

function showSetup() {
    const count = parseInt(document.getElementById("p-count").value);
    if(isNaN(count) || count < 1) return alert("人数を入力してください");
    let html = '<p>部員一人ひとりの絵文字と特性を選んでください</p><div class="setup-grid">';
    for(let i=1; i<=count; i++) {
        html += `<div class="setup-item">
            #${i} 名:<input id="n-${i}" style="width:60px;" value="部員${i}"> 
            絵:<input id="e-${i}" style="width:30px;" value="🎾"><br>
            <select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select>
        </div>`;
    }
    html += `</div><button class="big-btn" onclick="initGame(${count})">この名簿で試合開始！</button>`;
    document.getElementById("flow-content").innerHTML = html;
}

function initGame(count) {
    players = [];
    for(let i=1; i<=count; i++) {
        players.push({
            name: document.getElementById(`n-${i}`).value || `部員${i}`,
            emoji: document.getElementById(`e-${i}`).value || "🎾",
            trait: traits.find(t=>t.id === document.getElementById(`t-${i}`).value),
            pos: 0, money: 5000, goal: false
        });
    }
    document.getElementById("flow-overlay").style.display = "none";
    render();
}

function showMsg(title, icon, body, cb, isRoulette = false) {
    document.getElementById("msg-title").innerText = title;
    document.getElementById("msg-player-icon").innerText = icon;
    document.getElementById("msg-body").innerHTML = body;
    document.getElementById("msg-overlay").style.display = "flex";
    
    const okBtn = document.getElementById("msg-ok-btn");
    const rBox = document.getElementById("roulette-box");
    const rStop = document.getElementById("roulette-stop-btn");

    if(isRoulette) {
        okBtn.style.display = "none";
        rBox.style.display = "block";
        rStop.style.display = "inline-block";
        startRewardRoulette();
    } else {
        okBtn.style.display = "inline-block";
        rBox.style.display = "none";
        rStop.style.display = "none";
    }
    window._cb = cb;
}

function hideMsg() {
    document.getElementById("msg-overlay").style.display = "none";
    if(window._cb) window._cb();
}

function startRewardRoulette() {
    const rewards = [1000, 2000, 3000, 5000, 10000];
    const rBox = document.getElementById("roulette-box");
    rouletteInterval = setInterval(() => {
        rBox.innerText = "💰 " + rewards[Math.floor(Math.random()*rewards.length)] + "円";
    }, 50);
}

function stopRewardRoulette() {
    clearInterval(rouletteInterval);
    const amount = parseInt(document.getElementById("roulette-box").innerText.replace(/[^0-9]/g, ""));
    players[turn].money += amount;
    document.getElementById("msg-body").innerHTML += `<br><br><b>結果：${amount}円 獲得！</b>`;
    document.getElementById("roulette-stop-btn").style.display = "none";
    document.getElementById("msg-ok-btn").style.display = "inline-block";
}

function rollDice() {
    if(isRolling) return; isRolling = true;
    const p = players[turn];
    const diceDiv = document.getElementById("diceNum");
    const bonusDiv = document.getElementById("bonus-desc");
    bonusDiv.innerText = "";
    let count = 0;
    const timer = setInterval(() => {
        diceDiv.innerText = ["⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)];
        if(++count > 15) {
            clearInterval(timer);
            let base = Math.floor(Math.random()*6)+1;
            let final = base;
            let w = weathers[weatherIdx].n;
            if(w==="晴れ" && p.trait.id==="sun") { final++; bonusDiv.innerText = "☀️特性ボーナス +1"; }
            if(w==="強風" && p.trait.id==="wind") { final++; bonusDiv.innerText = "🌀特性ボーナス +1"; }
            if(w==="雨") {
                if(p.trait.id!=="strong") { final = Math.max(1, final-1); bonusDiv.innerText = "☔雨の減速 -1"; }
                else { bonusDiv.innerText = "🌿雑草魂で減速なし！"; }
            }
            diceDiv.innerHTML = `${["⚀","⚁","⚂","⚃","⚄","⚅"][base-1]} <span style="font-size:60px;">${final}</span>`;
            setTimeout(() => move(final), 800);
        }
    }, 60);
}

function move(s) {
    let p = players[turn];
    p.pos = Math.min(squares.length-1, p.pos + s);
    render();
    setTimeout(() => {
        const sq = squares[p.pos];
        if(sq.t === "reward") {
            showMsg("😁 ご褒美ルーレット！", p.emoji, `${p.name}にボーナスのチャンス！`, endTurn, true);
        } else if(sq.t === "mini") {
            p.money += 2000;
            showMsg("☠ 対決勝利！", p.emoji, `${p.name}はミニゲームに勝利した！<br>+2000円`, endTurn);
        } else if(sq.m !== undefined) {
            let amt = (sq.m < 0 && p.trait.id === "strong") ? Math.floor(sq.m/2) : sq.m;
            p.money += amt;
            showMsg(amt>=0?"👍 ナイス！":"👎 事件...", p.emoji, `${sq.txt}<br>${amt}円`, endTurn);
        } else if(p.pos === squares.length-1) {
            p.goal = true; p.money += 15000;
            showMsg("🏅 引退！", p.emoji, `${p.name}がゴール！<br>引退ボーナス 15000円`, endTurn);
        } else { endTurn(); }
    }, 400);
}

function triggerGekokujo() {
    const p = players[turn];
    const top = [...players].filter(x=>!x.goal).sort((a,b)=>b.pos - a.pos)[0];
    if(p === top) return alert("君がトップだ！");
    showMsg("⚔️ 下剋上の宣言！", p.emoji, `1位の${top.name}に挑みます！<br>勝てれば場所を入れ替え、負ければ罰金3000円！`, () => {
        if(Math.random() > 0.5) {
            let tmp = p.pos; p.pos = top.pos; top.pos = tmp;
            showMsg("🎊 成功！", p.emoji, `下剋上成功！${top.name}と入れ替わりました！`, render);
        } else {
            p.money -= 3000;
            showMsg("💀 失敗...", p.emoji, `返り討ちに遭いました...<br>罰金 3000円`, render);
        }
    });
}

function triggerTrade() {
    const p = players[turn];
    const targetName = prompt("誰に賄賂を渡しますか？（名前を正確に入力）");
    const target = players.find(x => x.name === targetName);
    if(!target || target === p) return alert("相手がいないぞ");
    p.money -= 3000; target.money += 3000; p.pos = Math.min(squares.length-1, p.pos + 3);
    showMsg("🕶 闇取引", "💰", `${target.name}と取引して3マス進みました。`, render);
}

function endTurn() {
    globalTurn++;
    if(globalTurn % 10 === 0) {
        let list = [], favs = [];
        players.forEach(pl => {
            if(pl.goal) return;
            if(pl.trait.id === "fav") favs.push(pl.emoji+pl.name);
            else { pl.money -= 2000; list.push(pl.emoji+pl.name); }
        });
        showMsg("💰 部費徴収！", "💸", `徴収(-2000円):<br>${list.join(", ") || "なし"}<br><br>✨免除:<br>${favs.join(", ") || "なし"}`, checkWeather);
    } else { checkWeather(); }
}

function checkWeather() {
    if(globalTurn % 3 === 0) {
        weatherIdx = (weatherIdx + 1) % weathers.length;
        const w = weathers[weatherIdx];
        showMsg(`${w.i} 天候変化`, w.i, `これからの天気：<b>${w.n}</b><br>${w.d}`, nextP);
    } else { nextP(); }
}

function nextP() {
    isRolling = false;
    if(players.every(pl => pl.goal)) {
        let res = [...players].sort((a,b)=>b.money-a.money).map((p,i)=>`${i+1}位:${p.emoji}${p.name}(💰${p.money})`).join("<br>");
        showMsg("🏆 結果発表", "🎾", res, () => location.reload());
        return;
    }
    do { turn = (turn + 1) % players.length; } while(players[turn].goal);
    document.getElementById("weather-ui").innerText = weathers[weatherIdx].i + " " + weathers[weatherIdx].n;
    document.getElementById("diceNum").innerText = "🎲";
    document.getElementById("bonus-desc").innerText = "";
    document.getElementById("tradeBtn").style.display = (players[turn].money < 0) ? "inline-block" : "none";
    render();
}

function render() {
    document.getElementById("statusArea").innerHTML = players.map((p,i) => `
        <div class="money-card ${i===turn?'active-p':''}">
            <span style="font-size:20px;">${p.emoji}</span> <b>${p.name}</b><br>
            💰 ${p.money}円 <small>(${p.trait.n})</small>
        </div>`).join("");
    const b = document.getElementById("board"); b.innerHTML = "";
    squares.forEach((s,i) => {
        let typeClass = s.t === "reward" ? "type-reward" : (s.t === "mini" ? "type-mini" : "");
        b.innerHTML += `<div class="square ${typeClass}"><small>${i}</small><b>${s.txt}</b><div id="p-box-${i}"></div></div>`;
    });
    players.forEach(p => {
        const span = document.createElement("span"); span.className="token-emoji"; span.innerText=p.emoji;
        const box = document.getElementById(`p-box-${p.pos}`);
        if(box) box.appendChild(span);
    });
}
</script>
</body>
</html>
