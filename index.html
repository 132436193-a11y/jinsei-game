<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：特性フル稼働版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --blue: #3498db; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  /* 通知オーバーレイ */
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  .explain-card { background: white; color: #333; padding: 30px; border-radius: 30px; border: 8px solid var(--green); max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  
  /* ボタン・UI */
  button.big-btn { font-size: 18px; padding: 12px 30px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 4px 0 #1b5e38; transition: 0.1s; margin: 5px; }
  button.big-btn:active { transform: translateY(2px); box-shadow: none; }
  .weather-ui { font-size: 24px; font-weight: bold; padding: 10px; border-radius: 10px; min-width: 120px; text-align: center; border: 3px solid #ddd; background: white; }
  
  /* ボード・コマ */
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; padding: 4px; font-size: 9px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
  .token-emoji { font-size: 24px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); transition: 0.5s; }
  
  #sidebar { flex: 0 0 250px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; overflow-y: auto; }
  .money-card { padding: 8px; border-radius: 8px; background: #fff; border: 2px solid #ddd; margin-bottom: 5px; }
  .active-p { border-color: #ffde59 !important; background: #fffde0 !important; border-width: 4px; }
  .bonus-text { color: #e67e22; font-weight: bold; font-size: 14px; animation: flash 0.5s infinite alternate; }
  @keyframes flash { from { opacity: 0.5; } to { opacity: 1; } }
</style>
</head>
<body>

<div id="msg-overlay" class="full-overlay">
  <div class="explain-card">
    <div id="msg-title" style="font-size:32px; font-weight:bold;"></div>
    <div id="msg-body" style="font-size:20px; margin:20px 0;"></div>
    <button class="big-btn" onclick="hideMsg()">了解！</button>
  </div>
</div>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card">
    <h2>🎾 テニス部人生ゲーム：特性覚醒版</h2>
    <div id="flow-content">
      <p>人数を入力（最大20人）</p>
      <input type="number" id="player-count" value="14" style="font-size: 24px; width: 80px; text-align: center;">
      <br><button class="big-btn" onclick="showPlayerSetup()">名簿入力へ</button>
    </div>
  </div>
</div>

<div class="main-container">
  <div id="sidebar"><div id="statusArea"></div></div>
  <div id="game-area">
    <div id="top-bar" style="display:flex; justify-content:space-around; align-items:center; background:white; padding:10px; border-radius:15px;">
      <div id="weather-display" class="weather-ui">☀️ 晴れ</div>
      <div id="dice-container" style="text-align:center;">
        <div id="diceNum" style="font-size:60px; color:var(--green);">🎲</div>
        <div id="trait-bonus" style="height:20px;"></div>
      </div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const traits = [
    {id:"none", n:"普通の部員", d:"特になし"},
    {id:"fav", n:"顧問の愛弟子", d:"【免除】部費を1円も払わなくて良い"},
    {id:"sun", n:"晴れ男/女", d:"【快足】晴れの時にサイコロ+1"},
    {id:"wind", n:"追い風マスタ", d:"【加速】強風の時にサイコロ+1"},
    {id:"strong", n:"雑草魂", d:"【根性】雨の影響なし、支払い金額半分"}
];
const squares = [{t:"start", txt:"集合"}, {t:"normal", txt:"ラケット破損", m:-4000}, {t:"normal", txt:"部室掃除", m:500}, {t:"reward", txt:"😁"}, {t:"normal", txt:"大会遠征", m:-2000}, {t:"normal", txt:"勝利報酬", m:5000}, {t:"normal", txt:"ドリンク代", m:-1000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"自主練", m:1000}, {t:"normal", txt:"ガット張替", m:-2500}, {t:"normal", txt:"エースの自覚", m:4000}, {t:"reward", txt:"😁"}, {t:"goal", txt:"引退"}];
const weathers = [
    {n:"晴れ", i:"☀️", d:"「晴れ男/女」が絶好調！"},
    {n:"雨", i:"☔", d:"全員サイコロ-1！「雑草魂」だけが耐えられる..."},
    {n:"強風", i:"🌀", d:"「追い風マスタ」が加速！"}
];

let players = [], turn = 0, weatherIdx = 0, globalTurn = 0, isRolling = false;

function showPlayerSetup() {
    const count = document.getElementById("player-count").value;
    let h = '<div style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">';
    for(let i=1; i<=count; i++) h += `<div style="font-size:12px;">${i}:<input id="n-${i}" placeholder="名" style="width:50px;"><select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select></div>`;
    h += '</div><button class="big-btn" onclick="start()">開始！</button>';
    document.getElementById("flow-content").innerHTML = h;
}

function start() {
    const count = document.getElementById("player-count").value;
    for(let i=1; i<=count; i++) players.push({name:document.getElementById(`n-${i}`).value||`部員${i}`, emoji:"🎾", trait:traits.find(t=>t.id===document.getElementById(`t-${i}`).value), pos:0, money:5000, goal:false});
    document.getElementById("flow-overlay").style.display="none";
    render();
}

function showMsg(title, body, cb) {
    document.getElementById("msg-title").innerText = title;
    document.getElementById("msg-body").innerHTML = body;
    document.getElementById("msg-overlay").style.display = "flex";
    window._cb = cb;
}
function hideMsg() {
    document.getElementById("msg-overlay").style.display = "none";
    if(window._cb) window._cb();
}

function rollDice() {
    if(isRolling) return; isRolling = true;
    const p = players[turn];
    const bonusArea = document.getElementById("trait-bonus");
    bonusArea.innerText = "";
    
    let count = 0;
    const timer = setInterval(() => {
        document.getElementById("diceNum").innerText = ["⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)];
        if(++count > 15) {
            clearInterval(timer);
            let base = Math.floor(Math.random()*6)+1;
            let final = base;
            let w = weathers[weatherIdx].n;
            
            // --- 特性ロジック ---
            if(w==="晴れ" && p.trait.id==="sun") { final++; bonusArea.innerHTML = "<span class='bonus-text'>☀️特性ボーナス +1</span>"; }
            if(w==="強風" && p.trait.id==="wind") { final++; bonusArea.innerHTML = "<span class='bonus-text'>🌀特性ボーナス +1</span>"; }
            if(w==="雨") {
                if(p.trait.id!=="strong") { final = Math.max(1, final-1); bonusArea.innerHTML = "<span style='color:blue;'>☔雨の減速 -1</span>"; }
                else { bonusArea.innerHTML = "<span class='bonus-text'>🌿雑草魂で減速なし！</span>"; }
            }

            document.getElementById("diceNum").innerHTML = `<span>${["⚀","⚁","⚂","⚃","⚄","⚅"][base-1]}</span> <b style="font-size:70px;">${final}</b>`;
            setTimeout(() => move(final), 800);
        }
    }, 60);
}

function move(s) {
    let p = players[turn];
    p.pos = Math.min(squares.length-1, p.pos + s);
    render();
    setTimeout(() => {
        const sq = squares[p.pos];
        if(sq.t === "reward") {
            const r = 3000; p.money += r;
            showMsg("😁 ラッキー！", `${p.name}はやる気が上がった！<br>+${r}円`, endTurn);
        } else if(sq.m) {
            let amt = sq.m;
            if(amt < 0 && p.trait.id === "strong") {
                amt = Math.floor(amt/2);
                showMsg("🌿 雑草魂！", `${p.name}は持ち前の根性で出費を半分に抑えた！<br>${sq.txt}: ${amt}円`, endTurn);
            } else {
                showMsg(amt>0?"👍 ナイス！":"👎 事件...", `${sq.txt}<br>${amt}円`, endTurn);
            }
            p.money += amt;
        } else { endTurn(); }
    }, 400);
}

function endTurn() {
    globalTurn++;
    if(globalTurn % 10 === 0) {
        let list = players.filter(pl => !pl.goal && pl.trait.id !== "fav").map(pl => { pl.money -= 2000; return pl.name; });
        let lucky = players.filter(pl => !pl.goal && pl.trait.id === "fav").map(pl => pl.name);
        let msg = `現役部員から2000円徴収しました。<br><br>💸 徴収：${list.join(", ")}`;
        if(lucky.length) msg += `<br>✨ 免除(愛弟子)：${lucky.join(", ")}`;
        showMsg("💰 部費徴収の時間", msg, nextPlayer);
    } else if(globalTurn % 3 === 0) {
        weatherIdx = (weatherIdx + 1) % weathers.length;
        const w = weathers[weatherIdx];
        showMsg(`${w.i} 天候変化`, `これからの天気：<b>${w.n}</b><br>${w.d}`, nextPlayer);
    } else { nextPlayer(); }
}

function nextPlayer() {
    isRolling = false;
    do { turn = (turn + 1) % players.length; } while(players[turn].goal);
    document.getElementById("weather-display").innerText = weathers[weatherIdx].i + " " + weathers[weatherIdx].n;
    document.getElementById("diceNum").innerText = "🎲";
    document.getElementById("trait-bonus").innerText = "";
    render();
}

function render() {
    document.getElementById("statusArea").innerHTML = players.map((p,i) => `<div class="money-card ${i===turn?'active-p':''}"><b>${p.name}</b> (${p.trait.n})<br>💰 ${p.money}円</div>`).join("");
    const b = document.getElementById("board"); b.innerHTML = "";
    squares.forEach((s,i) => {
        b.innerHTML += `<div class="square"><small>${i}</small><b>${s.txt}</b><div id="p-${i}"></div></div>`;
    });
    players.forEach(p => {
        const span = document.createElement("span"); span.className="token-emoji"; span.innerText=p.emoji;
        document.getElementById(`p-${p.pos}`).appendChild(span);
    });
}
</script>
</body>
</html>
