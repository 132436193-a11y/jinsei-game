<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：レジェンド完全版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --rain: #4682b4; --wind: #f0e68c; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; transition: background 1s; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  /* フルスクリーンオーバーレイ */
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  .explain-card { background: white; color: #333; padding: 30px; border-radius: 30px; border: 10px solid var(--green); max-width: 800px; width: 95%; max-height: 95vh; overflow-y: auto; }
  .explain-card h1 { color: var(--green); margin-top: 0; font-size: 28px; }
  
  /* 下剋上専用演出スタイル */
  #revolt-overlay { background: rgba(231, 76, 60, 0.95); z-index: 30000; }
  .revolt-title { font-size: 80px; font-weight: bold; color: yellow; text-shadow: 5px 5px 0 #000; margin: 0; animation: shake 0.5s infinite; }
  .revolt-matchup { font-size: 40px; margin: 20px 0; color: white; }
  .revolt-dice-area { display: flex; gap: 50px; font-size: 60px; margin: 30px 0; }
  @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(5px,5px); } 50% { transform: translate(-5px,-5px); } 75% { transform: translate(5px,-5px); } 100% { transform: translate(0,0); } }

  /* 既存のスタイル維持 */
  button.big-btn { font-size: 22px; padding: 12px 40px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 5px 0 #1b5e38; transition: 0.1s; }
  button.big-btn:active { transform: translateY(3px); box-shadow: none; }
  #sidebar { flex: 0 0 280px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 10px; border-radius: 10px; background: #fff; border: 3px solid #ddd; margin-bottom: 8px; transition: 0.3s; position: relative; }
  .active-p { border-color: #ffde59 !important; transform: scale(1.05); left: 10px; box-shadow: 0 0 15px rgba(255,222,89,0.8); background: #fffde0 !important; }
  .rank-badge { font-size: 10px; font-weight: bold; color: white; background: #666; padding: 2px 6px; border-radius: 4px; display: inline-block; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; position: relative; }
  .token { width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; display: inline-block; }
  .event-overlay-mini { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 999; flex-direction: column; background: rgba(0,0,0,0.85); color:white; }
  .event-card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 80%; border: 8px solid var(--green); text-align: center; }
  #big-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: bold; color: white; text-shadow: 0 0 30px rgba(0,0,0,1); z-index: 10000; pointer-events: none; display: none; }
  .pyramid-container { display: flex; flex-direction: column; align-items: center; margin: 20px 0; gap: 4px; }
  .p-row { padding: 8px; border-radius: 4px; font-weight: bold; color: white; text-align: center; width: 100%; }
</style>
</head>
<body>

<div id="revolt-overlay" class="full-overlay">
  <p class="revolt-title">💥 下剋上 発生！</p>
  <div id="revolt-matchup" class="revolt-matchup"></div>
  <div class="revolt-dice-area">
    <div id="dice-challenger">🎲?</div>
    <div style="color: yellow;">VS</div>
    <div id="dice-target">🎲?</div>
  </div>
  <div id="revolt-status" style="font-size: 30px; font-weight: bold; height: 50px;"></div>
  <button id="revolt-action-btn" class="big-btn" style="background: white; color: black; margin-top: 20px;">運命のダイスを振る！</button>
</div>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card" id="flow-card">
    <h1 id="flow-title">🎾 テニス部人生ゲーム</h1>
    <div id="flow-content">
      <p style="text-align: center;">引退試合を始めます。まずは参加人数と名前を入力してください。</p>
      <button class="big-btn" onclick="inputPhase()">名前を入力して次へ</button>
    </div>
  </div>
</div>

<div id="special-rule-overlay" class="full-overlay"><div class="explain-card"><h1 id="special-title"></h1><p id="special-text"></p><div id="dark-contract-btns" style="display:none;"><button class="big-btn" onclick="acceptDarkContract()">闇と契約する</button><button class="big-btn" style="background:#666; margin-left:10px;" onclick="closeSpecialRule()">断る</button></div><button id="special-understand-btn" class="big-btn" onclick="closeSpecialRule()">理解した</button></div></div>
<div id="event-overlay" class="event-overlay-mini"><div class="event-card"><div id="ev-player"></div><div id="ev-text"></div><div id="ev-money"></div><button id="ev-close" class="big-btn" onclick="closeEvent()">次へ</button></div></div>
<div id="big-alert"></div>
<div id="result-overlay" class="full-overlay"><h1>最終結果発表</h1><div id="rank-list"></div><button class="big-btn" onclick="location.reload()">もう一度</button></div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center;">部員名簿</h3>
    <div id="statusArea"></div>
    <button id="revolt-btn" onclick="prepareRevolt()" style="width:100%; margin-top:5px; font-size:14px; background:#e67e22; border:none; color:white; padding:12px; border-radius:8px; cursor:pointer; display:none;">💥 審判に異議申し立て</button>
  </div>
  <div id="game-area">
    <div id="top-bar">
      <div id="weather-display">☀️ 晴れ</div>
      <div id="diceNum">🎲</div>
      <button id="diceBtn" class="big-btn" onclick="checkDarkShop()">サイコロを振る</button>
      <div>徴収まで: <span id="turns-left">10</span></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
// マス目と基本データ
const squares = [{t:"start", txt:"集合"}, {t:"normal", txt:"ガット切れ", m:-3000}, {t:"normal", txt:"チャリパンク", m:-1000}, {t:"reward", txt:"ラッキー"}, {t:"normal", txt:"大会決定", m:5000}, {t:"mini", txt:"★対決マス"}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"居残り練習", m:-500}, {t:"normal", txt:"勝利報酬", m:5000}, {t:"reward", txt:"ドリンク"}, {t:"normal", txt:"休み", m:0}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"筋トレ代", m:-500}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"好調！", m:2000}, {t:"reward", txt:"OBの差し入れ"}, {t:"normal", txt:"大会遠征費", m:-2000}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"臨時ボーナス", m:3000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"忘れ物罰金", m:-1000}, {t:"normal", txt:"ガット張替", m:-1500}, {t:"reward", txt:"おやつタイム"}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"褒美", m:2000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"練習集中", m:1000}, {t:"reward", txt:"部費還元"}, {t:"normal", txt:"強打失敗", m:-1000}, {t:"mini", txt:"★対決マス"}, {t:"normal", txt:"絶好調", m:4000}, {t:"goal", txt:"引退"}];
const traits = [{name: "顧問の愛弟子", id: "fav"}, {name: "晴れ男/女", id: "rain_immune"}, {name: "追い風マスター", id: "wind_pro"}, {name: "顧問の怒られ役", id: "unlucky"}, {name: "普通の部員", id: "none"}];
let players = [], turn = 0, isMoving = false, globalTurnCount = 0, currentWeather = "sunny";

// 初期フロー（変更なし）
function inputPhase() { const count = parseInt(prompt("部員は何人？")) || 2; players = []; for(let i=0; i<count; i++){ const t = traits[Math.floor(Math.random()*traits.length)]; players.push({ id:i, name: prompt((i+1)+"人目の名前")||"部員"+(i+1), pos:0, money:0, goal:false, color:`hsl(${i*(360/count)},70%,50%)`, darkContract:false, hasRevolted:false, trait:t }); } showRuleBase(); }
function showRuleBase() { document.getElementById("flow-title").innerText="🎾 基本ルール"; document.getElementById("flow-content").innerHTML=`<p>・お金を一番持っていた人が優勝！<br>・10ターンごとに部費徴収！</p><button class="big-btn" onclick="showRulePyramid()">次へ</button>`; }
function showRulePyramid() { document.getElementById("flow-title").innerText="📊 格付け"; document.getElementById("flow-content").innerHTML=`<div class="pyramid-container"><div class="p-row" style="background:#ffd700; color:#333">レジェンド</div><div class="p-row" style="background:#ff4500">エース</div><div class="p-row" style="background:#32cd32">レギュラー</div><div class="p-row" style="background:#4682b4">平部員</div><div class="p-row" style="background:#8a2be2">雑用係</div><div class="p-row" style="background:#000">部の恥</div></div><button class="big-btn" onclick="showRuleTrait()">次へ</button>`; }
function showRuleTrait() { document.getElementById("flow-title").innerText="✨ 特性"; document.getElementById("flow-content").innerHTML=`<p>顧問の愛弟子や晴れ男など、特別な能力があります。</p><button class="big-btn" onclick="showRuleDark()">次へ</button>`; }
function showRuleDark() { document.getElementById("flow-title").innerText="👿 闇取引"; document.getElementById("flow-content").innerHTML=`<p>借金した時だけ使える禁断の契約。</p><button class="big-btn" onclick="showRuleRevolt()">次へ</button>`; }
function showRuleRevolt() { document.getElementById("flow-title").innerText="💥 下剋上"; document.getElementById("flow-content").innerHTML=`<p>最下位の人だけが1位の人に勝負を挑み、場所を入れ替えられます！</p><button class="big-btn" onclick="startGame()">スタート！</button>`; }
function startGame() { document.getElementById("flow-overlay").style.display="none"; renderBoard(); updateStatus(); }

// --- 💥 下剋上システム強化パーツ ---
function prepareRevolt() {
  const challenger = players[turn];
  const target = [...players].sort((a,b)=>b.money - a.money)[0];
  if (challenger === target) { alert("あなたが1位です！下剋上は必要ありません。"); return; }

  const overlay = document.getElementById("revolt-overlay");
  const matchup = document.getElementById("revolt-matchup");
  const btn = document.getElementById("revolt-action-btn");
  const status = document.getElementById("revolt-status");
  
  overlay.style.display = "flex";
  matchup.innerHTML = `<span style="color:${challenger.color}">${challenger.name}</span> VS <span style="color:${target.color}">${target.name}(1位)</span>`;
  status.innerText = "最下位からの逆襲が始まる...";
  document.getElementById("dice-challenger").innerText = "🎲?";
  document.getElementById("dice-target").innerText = "🎲?";

  btn.onclick = () => {
    btn.disabled = true;
    let count = 3;
    const timer = setInterval(() => {
      status.innerText = count > 0 ? count : "GO!!!";
      if(count === 0) {
        clearInterval(timer);
        executeRevolt(challenger, target);
      }
      count--;
    }, 800);
  };
}

function executeRevolt(challenger, target) {
  const r1 = Math.floor(Math.random() * 6) + 1;
  const r2 = Math.floor(Math.random() * 6) + 1;
  const status = document.getElementById("revolt-status");
  
  document.getElementById("dice-challenger").innerText = "🎲" + r1;
  document.getElementById("dice-target").innerText = "🎲" + r2;

  setTimeout(() => {
    challenger.hasRevolted = true;
    if (r1 > r2) {
      status.innerHTML = "<span style='color:yellow; font-size:50px;'>下剋上成功！入れ替わり！</span>";
      let tPos = challenger.pos; challenger.pos = target.pos; target.pos = tPos;
      renderBoard();
    } else {
      status.innerHTML = "<span style='color:white; font-size:50px;'>下剋上失敗... 罰金2000円</span>";
      challenger.money -= 2000;
    }
    
    const btn = document.getElementById("revolt-action-btn");
    btn.disabled = false;
    btn.innerText = "現実に戻る";
    btn.onclick = () => {
      document.getElementById("revolt-overlay").style.display = "none";
      btn.innerText = "運命のダイスを振る！";
      updateStatus();
    };
  }, 1000);
}

// 既存のメインロジック（そのまま）
function checkDarkShop() { const p = players[turn]; if (p.money < 0 && !p.darkContract) { showSpecialRule('dark'); } else { rollDice(); } }
function showSpecialRule(type) { const overlay = document.getElementById("special-rule-overlay"); const title = document.getElementById("special-title"); const text = document.getElementById("special-text"); overlay.style.display = "flex"; if(type === 'dark') { title.innerText = "👿 闇取引"; text.innerHTML = "ダイスが2個になる代わりに賞金半分。契約する？"; document.getElementById("dark-contract-btns").style.display="block"; document.getElementById("special-understand-btn").style.display="none"; } }
function acceptDarkContract() { players[turn].darkContract = true; closeSpecialRule(); }
function closeSpecialRule() { document.getElementById("special-rule-overlay").style.display = "none"; rollDice(); }
function rollDice() { if(isMoving || players[turn].goal) return; isMoving = true; document.getElementById("diceBtn").disabled = true; const dice = document.getElementById("diceNum"); dice.classList.add("rolling"); setTimeout(() => { dice.classList.remove("rolling"); let p = players[turn]; let total = (Math.floor(Math.random()*6)+1) + (p.darkContract?Math.floor(Math.random()*6)+1:0); if (currentWeather === "rainy" && p.trait.id !== "rain_immune") total = Math.ceil(total/2); if (currentWeather === "windy") total += (p.trait.id === "wind_pro"?3:2); dice.innerText = "🎲 "+total; setTimeout(() => move(total), 600); }, 1000); }
function move(steps) { let p = players[turn]; p.pos = Math.min(squares.length-1, p.pos+steps); if(p.pos === squares.length-1) { p.goal = true; p.money += p.darkContract?15000:30000; } renderBoard(); setTimeout(() => processSquare(p, squares[p.pos]), 300); }
function processSquare(p, s) { if (s.t === "mini") showEvent(p, "🔥 現実対決！", "顧問「さあ、現実で勝負だ！」"); else if (s.t === "warp") { p.pos = Math.max(0, p.pos + (Math.random()>0.5?3:-3)); renderBoard(); showEvent(p, "🌀 ワープ", "場所が移動！"); } else { let amount = s.m||0; if(amount<0 && p.trait.id === "unlucky") amount = Math.floor(amount*1.2); p.money += amount; showEvent(p, amount>=0?"👍":"👎", s.txt+"<br>"+amount+"円"); } }
function showEvent(p, title, text) { const job = getJobTitle(p.money); document.getElementById("ev-player").innerHTML = `<span style="color:${job.color}">${job.title}</span> ${p.name}`; document.getElementById("ev-text").innerText = title; document.getElementById("ev-money").innerHTML = text; document.getElementById("event-overlay").style.display = "flex"; }
function closeEvent() { document.getElementById("event-overlay").style.display = "none"; finishTurn(); }
function finishTurn() { globalTurnCount++; document.getElementById("turns-left").innerText = 10 - (globalTurnCount%10); if(globalTurnCount%10===0) { players.forEach(p => { if(p.trait.id !== "fav") p.money -= 3000; }); } isMoving = false; document.getElementById("diceBtn").disabled = false; if(players.every(pl => pl.goal)) showFinalResults(); else { do { turn = (turn + 1) % players.length; } while(players[turn].goal); updateStatus(); } }
function renderBoard() { const b = document.getElementById("board"); b.innerHTML = ""; squares.forEach((s, i) => { b.innerHTML += `<div class="square"> ${i} <b>${s.txt}</b><div id="p-at-${i}"></div></div>`; }); players.forEach(p => { const t = document.createElement("div"); t.className = "token"; t.style.background = p.color; document.getElementById(`p-at-${p.pos}`).appendChild(t); }); }
function updateStatus() { document.getElementById("statusArea").innerHTML = players.map((p, i) => { const job = getJobTitle(p.money); return `<div class="money-card ${i===turn?'active-p':''}"> <span class="rank-badge" style="background:${job.color}">${job.title}</span><br> <b style="color:${p.color}">${p.name}</b><br>💰 <b>${p.money}</b>円 </div>`}).join(""); const low = [...players].sort((a,b)=>a.money-b.money)[0]; document.getElementById("revolt-btn").style.display = (players[turn] === low && !low.hasRevolted) ? "block" : "none"; }
function getJobTitle(money) { if (money >= 50000) return {title: "👑 レジェンド", color: "#ffd700"}; if (money >= 30000) return {title: "🎾 エース", color: "#ff4500"}; if (money >= 10000) return {title: "💪 レギュラー", color: "#32cd32"}; if (money >= 0) return {title: "🎾 平部員", color: "#4682b4"}; if (money >= -10000) return {title: "🧹 雑用係", color: "#8a2be2"}; return {title: "💀 部の恥", color: "#000000"}; }
function showFinalResults() { document.getElementById("result-overlay").style.display = "flex"; const sorted = [...players].sort((a,b) => b.money - a.money); document.getElementById("rank-list").innerHTML = sorted.map((p, i) => `<div>${i+1}位: ${p.name} (${p.money}円)</div>`).join(""); }
window.onbeforeunload = function() { return "データが消えます"; };
</script>
</body>
</html>
