<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>女子テニス部人生ゲーム：青春決定版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --pink: #ff69b4; --blue: #4682b4; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 5px; box-sizing: border-box; gap: 5px; }
  #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white; }
  .scroll-card { background: white; padding: 30px; border-radius: 30px; border: 10px solid var(--pink); max-width: 900px; width: 90%; color: #333; text-align: center; overflow-y: auto; max-height: 90vh; }
  #sidebar { flex: 0 0 240px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 8px; border-radius: 10px; background: #fff; border: 3px solid #ddd; margin-bottom: 5px; }
  .active-p { border-color: var(--pink); background: #fff5f8; }
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--pink) !important; }
  .token-emoji { font-size: 20px; filter: drop-shadow(1px 1px 1px black); }
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 9999; background: rgba(0,0,0,0.9); }
  .event-card { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 500px; text-align: center; border: 8px solid var(--pink); }
  button.big-btn { padding: 12px 30px; font-size: 18px; background: var(--pink); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div id="start-overlay">
  <div class="scroll-card" id="setup-content">
    <h1 style="color:var(--pink)">🎾 女子テニス部人生ゲーム 🎾</h1>
    <p>人数: <input type="number" id="p-count" value="2" min="1" style="font-size:20px; width:60px;"></p>
    <button class="big-btn" onclick="initGame()">部活開始！</button>
  </div>
</div>

<div id="event-overlay" class="full-overlay">
  <div class="event-card">
    <div id="ev-player" style="font-size:20px;"></div>
    <div id="ev-text" style="font-size:28px; font-weight:bold; margin:15px 0;"></div>
    <div id="trade-ui" style="display:none; margin-bottom:10px;">
        相手: <select id="trade-target-select"></select>
        <button onclick="executeTrade()">取引実行</button>
    </div>
    <button id="ev-close" class="big-btn" onclick="closeEvent()">次へ</button>
    <button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ</button>
  </div>
</div>

<div class="main-container">
  <div id="sidebar">
    <div id="statusArea"></div>
    <button id="trade-btn" style="display:none; margin-top:5px;" onclick="triggerTradeUI()">🕶 闇取引</button>
  </div>
  <div id="game-area">
    <div id="top-bar" style="background:white; padding:10px; border-radius:15px; display:flex; justify-content:space-around; align-items:center;">
      <div id="diceNum" style="font-size:30px;">🎲 ?</div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
let players = [], turn = 0, isMoving = false, rouletteTimer = null;

const squares = [
  {t:"start", txt:"入学！"},
  {t:"normal", txt:"ガット張替え", m:-2000},
  {t:"normal", txt:"練習し過ぎで疲労骨折。", move:-3},
  {t:"reward", txt:"😁"},
  {t:"normal", txt:"おばちゃんの苦情。", m:-3000},
  {t:"normal", txt:"パンクして修理。", m:-4000, skip:true},
  {t:"normal", txt:"スマッシュでラケット破壊。", m:-15000},
  {t:"mini", txt:"★ぶりっ子選手権"},
  {t:"normal", txt:"ラインに躓いてローリングコケ。", m:1000},
  {t:"normal", txt:"中国大会出場！", move:5, m:-10000},
  {t:"normal", txt:"お守りもらってテンションアップ！", move:3},
  {t:"reward", txt:"😁"},
  {t:"normal", txt:"帽子を取ったら前髪終了。", move:-1},
  {t:"normal", txt:"スコアのポイントがプラスだった！", m:3000},
  {t:"normal", txt:"雨が降って部活がオフになる！", move:2},
  {t:"normal", txt:"靴から永遠に砂が出てくる。", move:-1},
  {t:"normal", txt:"顔にボールが直撃。", m:-2000, skip:true},
  {t:"reward", txt:"😁"},
  {t:"normal", txt:"先輩から怒られる。", move:-2},
  {t:"normal", txt:"試合に負けて顧問の機嫌超絶バッド。", m:-5000},
  {t:"normal", txt:"練習中に雪が降ってきてテンションマックス！", move:4},
  {t:"normal", txt:"やることがなくなっておしゃべりタイムスタート！", m:1000},
  {t:"normal", txt:"急に調子が良くなる！", move:2},
  {t:"reward", txt:"😁"},
  {t:"normal", txt:"ボールホルダー忘れて萎え。", move:-2},
  {t:"normal", txt:"応援に夢中になりすぎて声がかれる。", m:-1000},
  {t:"normal", txt:"日焼け止め塗っても、焼けまくる。", m:-1500},
  {t:"mini", txt:"★柔軟対決"},
  {t:"normal", txt:"奇跡のポール回し炸裂！", m:10000},
  {t:"normal", txt:"寄せ書きで号泣。", move:-1},
  {t:"normal", txt:"全国大会決勝！", m:20000},
  {t:"goal", txt:"引退"}
];

function initGame() {
  const count = parseInt(document.getElementById("p-count").value);
  const emojis = ["🎾","🎀","💄","🍦"];
  for(let i=0; i<count; i++) {
    players.push({id:i, name:`部員${i+1}`, emoji:emojis[i%4], pos:0, money:10000, goal:false, skip:false, rumor:false});
  }
  document.getElementById("start-overlay").style.display = "none";
  renderBoard(); updateStatus();
}

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => {
    b.innerHTML += `<div class="square type-${s.t}"><small>${i}</small><b>${s.txt}</b><div id="p-box-${i}"></div></div>`;
  });
  players.forEach(p => {
    const box = document.getElementById(`p-box-${p.pos}`);
    if(box) box.innerHTML += `<span class="token-emoji">${p.emoji}</span>`;
  });
}

function updateStatus() {
  document.getElementById("statusArea").innerHTML = players.map((p, i) => `
    <div class="money-card ${i===turn?'active-p':''}">
      ${p.emoji} <b>${p.name}</b><br>💰 ${p.money}円
      ${p.skip?'<br>❌休み':''}
    </div>`).join("");
  document.getElementById("trade-btn").style.display = players[turn].money < 0 ? "block" : "none";
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  if(players[turn].skip) {
    players[turn].skip = false;
    showEvent(players[turn], "休み明け", "練習復帰！", true);
    return;
  }
  isMoving = true;
  let dice = Math.floor(Math.random()*6)+1;
  document.getElementById("diceNum").innerText = "🎲 " + dice;
  setTimeout(() => move(dice), 500);
}

function move(steps) {
  let p = players[turn];
  p.pos = Math.min(squares.length-1, p.pos + steps);
  renderBoard();
  const s = squares[p.pos];
  if(s.t === "reward") startRoulette();
  else if(s.t === "mini") showEvent(p, "対決！", s.txt, true);
  else {
    if(s.m) p.money += s.m;
    if(s.skip) p.skip = true;
    if(s.move) p.pos = Math.max(0, Math.min(squares.length-1, p.pos + s.move));
    renderBoard();
    showEvent(p, "イベント", s.txt + (s.m ? `<br>${s.m}円` : ""), true);
  }
}

function showEvent(p, title, text, showBtn) {
  document.getElementById("ev-player").innerText = p.emoji + p.name;
  document.getElementById("ev-text").innerHTML = text;
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("ev-close").style.display = showBtn ? "block" : "none";
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  document.getElementById("trade-ui").style.display = "none";
  if(players[turn].pos === squares.length-1) players[turn].goal = true;
  isMoving = false;
  do { turn = (turn + 1) % players.length; } while(players.every(pl=>!pl.goal) && players[turn].goal);
  updateStatus();
}

function startRoulette() {
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => {
    document.getElementById("ev-text").innerText = ["💰5000円","💰1000円","🧃ジュース","🍬アメ"][Math.floor(Math.random()*4)];
  }, 50);
}

function stopRoulette() {
  clearInterval(rouletteTimer);
  const res = document.getElementById("ev-text").innerText;
  if(res.includes("円")) players[turn].money += parseInt(res.replace(/[^0-9]/g, ""));
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "block";
}

function triggerTradeUI() {
    const p = players[turn];
    const sel = document.getElementById("trade-target-select"); sel.innerHTML = "";
    players.forEach(target => { if(target !== p) sel.innerHTML += `<option value="${target.id}">${target.name}</option>`; });
    document.getElementById("trade-ui").style.display = "block";
    showEvent(p, "闇取引", "リスクを承知で取引しますか？", false);
}

function executeTrade() {
    const p = players[turn];
    const target = players[document.getElementById("trade-target-select").value];
    const rand = Math.random();
    if(rand < 0.7) { 
        p.money -= 3000; target.money += 3000; p.pos = Math.min(squares.length-1, p.pos + 3);
        showEvent(p, "成功", "3マス進んだ！", true);
    } else if(rand < 0.85) {
        p.money -= 5000; showEvent(p, "失敗", "顧問に見つかり罰金5000円。", true);
    } else {
        p.money -= 3000; showEvent(p, "裏切り", "お金だけ取られた。", true);
    }
    renderBoard();
}
</script>
</body>
</html>
