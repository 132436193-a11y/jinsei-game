<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：究極・真レジェンド版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; --rain: #4682b4; --wind: #f0e68c; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  
  .main-container { display: flex; height: 100vh; padding: 5px; box-sizing: border-box; gap: 5px; }
  
  /* ルール説明・設定画面 */
  #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 20000; display: flex; justify-content: center; align-items: center; flex-direction: column; color: white; }
  .scroll-card { background: white; padding: 30px; border-radius: 30px; border: 10px solid var(--green); max-width: 900px; width: 90%; color: #333; text-align: center; overflow-y: auto; max-height: 90vh; }
  
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
  .setup-item { background: #f0f0f0; padding: 10px; border-radius: 10px; font-size: 13px; }

  #sidebar { flex: 0 0 240px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 8px; border-radius: 10px; background: #fff; border: 3px solid #ddd; margin-bottom: 5px; }
  .active-p { border-color: #ffde59; transform: scale(1.02); box-shadow: 0 0 10px rgba(255,222,89,0.8); }

  #game-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  #top-bar { background: white; padding: 8px; border-radius: 15px; display: flex; justify-content: space-around; align-items: center; }

  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; }
  .token-emoji { font-size: 20px; filter: drop-shadow(1px 1px 1px black); }

  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.9); }
  .event-card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 80%; max-width: 600px; border: 8px solid var(--green); }
  
  button.big-btn { padding: 12px 30px; font-size: 18px; background: var(--green); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; margin: 5px; }
  #big-alert { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; font-weight: bold; color: white; text-shadow: 0 0 30px black; z-index: 10001; pointer-events: none; display: none; text-align: center; }
  
  .rank-item { opacity: 0; transform: translateY(20px); transition: all 1s; margin: 10px; font-size: 24px; color: white; }
  .rank-show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body id="bg-body">

<div id="start-overlay">
  <div class="scroll-card" id="setup-content">
    <h1 style="color:var(--green)">🎾 テニス部人生ゲーム 🎾</h1>
    <div style="background:#f9f9f9; padding:10px; border-radius:15px; margin:10px 0; font-size:14px; text-align:left;">
      <b>【ルール説明】</b><br>
      ・10ターン毎に部費徴収！(最下位と愛弟子は免除)<br>
      ・3ターン毎に天気が変化(自動で切り替わり)<br>
      ・借金状態なら「闇取引」解禁！3マス進める。
    </div>
    <p>人数を入力: <input type="number" id="p-count" value="14" style="font-size:20px; width:60px;"></p>
    <button class="big-btn" onclick="generateSetup()">次へ：部員設定</button>
  </div>
</div>

<div id="big-alert"></div>

<div id="event-overlay" class="full-overlay">
  <div id="ev-card" class="event-card">
    <div id="ev-player" style="font-size:24px; font-weight:bold;"></div>
    <div id="ev-text" style="font-size:40px; font-weight:bold; margin:10px 0;"></div>
    <div id="ev-money" style="font-size:30px; color:var(--red); font-weight:bold;"></div>
    <button id="ev-close" class="big-btn" onclick="closeEvent()">次へ進む</button>
    <button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button>
  </div>
</div>

<div id="result-overlay" class="full-overlay">
  <h1 style="font-size:40px; color:var(--gold);">🏅 最終結果発表 🏅</h1>
  <div id="rank-list"></div>
  <button class="big-btn" style="margin-top:30px; display:none;" id="restart-btn" onclick="location.reload()">再挑戦</button>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:5px 0;">部員名簿</h3>
    <div id="statusArea"></div>
    <button id="trade-btn" class="big-btn" style="background:#444; display:none;" onclick="triggerTrade()">🕶 闇取引</button>
    <button id="revolt-btn" class="big-btn" style="background:#e67e22; display:none;" onclick="triggerGekokujo()">💥 下剋上</button>
  </div>
  
  <div id="game-area">
    <div id="top-bar">
      <div id="weather-display" style="padding:5px 15px; border-radius:20px; font-weight:bold; background:var(--green); color:white;">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:40px;">🎲 ?</div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
      <div style="font-size:14px; background:var(--red); color:white; padding:5px 10px; border-radius:10px;">徴収まで: <span id="turns-left">10</span></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const traits = [
  {id:"fav", n:"顧問の愛弟子"}, {id:"sun", n:"晴れ男/女"}, {id:"wind", n:"追い風マスタ"}, {id:"strong", n:"雑草魂"}, {id:"none", n:"普通の部員"}
];

const squares = [
  {t:"start", txt:"集合"}, {t:"normal", txt:"ラケット粉砕", m:-3000}, {t:"normal", txt:"チャリパンク", m:-2000}, {t:"reward", txt:"😁"},
  {t:"normal", txt:"部室掃除", m:500}, {t:"mini", txt:"★腕相撲"}, {t:"normal", txt:"練習試合勝利", m:5000}, {t:"normal", txt:"道具係", m:-500},
  {t:"normal", txt:"エース覚醒", m:3000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"オフの日", m:0}, {t:"mini", txt:"★柔軟"},
  {t:"normal", txt:"筋トレ", m:-1000}, {t:"normal", txt:"買い出し", m:-500}, {t:"normal", txt:"フォーム改善", m:1000}, {t:"reward", txt:"😁"},
  {t:"normal", txt:"遠征試合", m:2000}, {t:"mini", txt:"★素振り"}, {t:"normal", txt:"小銭拾った", m:100}, {t:"normal", txt:"特訓成功", m:2000},
  {t:"normal", txt:"遅刻ペナルティ", m:-1500}, {t:"normal", txt:"ガット張替", m:-2000}, {t:"reward", txt:"😁"}, {t:"mini", txt:"★対決"},
  {t:"normal", txt:"顧問に褒められる", m:1000}, {t:"normal", txt:"ボール紛失", m:-1000}, {t:"normal", txt:"居残り練習", m:500}, {t:"reward", txt:"😁"},
  {t:"normal", txt:"すねを強打", m:-1000}, {t:"mini", txt:"★フットワーク"}, {t:"normal", txt:"県大会出場", m:8000}, {t:"goal", txt:"引退"}
];

let players = [], turn = 0, isMoving = false, globalTurnCount = 0, rouletteTimer = null, currentWeather = "sunny";

function generateSetup() {
  const count = parseInt(document.getElementById("p-count").value);
  let html = `<h2 style="color:var(--green)">部員設定</h2><div class="setup-grid">`;
  for(let i=0; i<count; i++) {
    html += `<div class="setup-item">
      #${i+1} 名前:<input id="n-${i}" style="width:70px;" value="部員${i+1}"><br>
      絵文字:<input id="e-${i}" style="width:30px;" value="🎾"><br>
      特性:<select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select>
    </div>`;
  }
  html += `</div><button class="big-btn" onclick="initGame(${count})">この名簿で部活開始！</button>`;
  document.getElementById("setup-content").innerHTML = html;
}

function initGame(count) {
  for(let i=0; i<count; i++) {
    players.push({
      id:i, name: document.getElementById(`n-${i}`).value, emoji: document.getElementById(`e-${i}`).value,
      pos: 0, money: 5000, goal: false, color: `hsl(${i*(360/count)}, 70%, 50%)`,
      trait: traits.find(t=>t.id === document.getElementById(`t-${i}`).value)
    });
  }
  document.getElementById("start-overlay").style.display = "none";
  renderBoard(); updateStatus();
}

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => {
    b.innerHTML += `<div class="square type-${s.t}"><small>${i}</small><b>${s.txt}</b><div id="p-box-${i}"></div></div>`;
  });
  players.forEach(p => {
    const span = document.createElement("span"); span.className="token-emoji"; span.innerText=p.emoji;
    document.getElementById(`p-box-${p.pos}`).appendChild(span);
  });
}

function updateStatus() {
  const sorted = [...players].sort((a,b)=>a.money-b.money);
  document.getElementById("statusArea").innerHTML = players.map((p, i) => `
    <div class="money-card ${i===turn?'active-p':''}">
      <span style="font-size:18px;">${p.emoji}</span> <b>${p.name}</b><br>💰 ${p.money}円<br><small>${p.trait.n}</small>
    </div>`).join("");
  document.getElementById("revolt-btn").style.display = (players[turn] === sorted[0] && !players[turn].goal) ? "block" : "none";
  document.getElementById("trade-btn").style.display = (players[turn].money < 0) ? "block" : "none";
}

function showAlert(text, duration = 2000) {
  const alertBox = document.getElementById("big-alert");
  alertBox.innerHTML = text;
  alertBox.style.display = "block";
  setTimeout(() => { alertBox.style.display = "none"; }, duration);
}

function updateWeather() {
  const rand = Math.random();
  const bg = document.getElementById("bg-body");
  const badge = document.getElementById("weather-display");
  let weatherText = "";
  if (rand < 0.4) {
    currentWeather = "sunny"; bg.style.background = "#1a1a1a";
    badge.innerText = "☀️ 晴れ"; badge.style.background = "var(--green)";
    weatherText = "☀️ 晴天！";
  } else if (rand < 0.7) {
    currentWeather = "rainy"; bg.style.background = "#001f3f";
    badge.innerText = "☔ 豪雨"; badge.style.background = "var(--rain)";
    weatherText = "☔ 豪雨！<br><small style='font-size:30px'>ダイス-1</small>";
  } else {
    currentWeather = "windy"; bg.style.background = "#3d3d00";
    badge.innerText = "🍃 追い風"; badge.style.background = "var(--wind)"; badge.style.color = "#333";
    weatherText = "🍃 追い風！<br><small style='font-size:30px'>全員+1マス</small>";
  }
  showAlert(weatherText, 2500);
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  isMoving = true;
  document.getElementById("diceBtn").disabled = true;
  
  let count = 0;
  const timer = setInterval(() => {
    document.getElementById("diceNum").innerText = ["⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)];
    if(++count > 15) {
      clearInterval(timer);
      let p = players[turn];
      let base = Math.floor(Math.random() * 6) + 1;
      let final = base;
      if(currentWeather === "sunny" && p.trait.id === "sun") final++;
      if(currentWeather === "windy" && p.trait.id === "wind") final++;
      if(currentWeather === "rainy" && p.trait.id !== "strong") final = Math.max(1, final - 1);
      document.getElementById("diceNum").innerHTML = `<span style="font-size:60px;">${final}</span>`;
      setTimeout(() => move(final), 800);
    }
  }, 60);
}

function move(steps) {
  let p = players[turn];
  p.pos = Math.min(squares.length - 1, p.pos + steps);
  if(p.pos === squares.length - 1) { p.goal = true; p.money += 15000; }
  renderBoard();
  
  const s = squares[p.pos];
  if(s.t === "reward") startRoulette(p);
  else if(s.t === "mini") showEvent(p, "🔥 現実対決！", s.txt, true);
  else {
    let m = s.m || 0;
    if(m < 0 && p.trait.id === "strong") m = Math.floor(m/2);
    p.money += m;
    showEvent(p, (m >= 0) ? "👍 出来事" : "👎 事件", s.txt + (m ? `<br>${m}円` : ""), true);
  }
}

function startRoulette(p) {
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "inline-block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => { document.getElementById("ev-money").innerText = ["💰5000円","💰10000円","🧃ジュース","🍪お菓子"][Math.floor(Math.random()*4)]; }, 50);
}

function stopRoulette() {
  clearInterval(rouletteTimer);
  const res = document.getElementById("ev-money").innerText;
  if(res.includes("円")) players[turn].money += parseInt(res.replace(/[^0-9]/g, ""));
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
}

function triggerGekokujo() {
  const p = players[turn];
  const target = [...players].sort((a,b)=>b.pos - a.pos)[0];
  showAlert("💥 下剋上開始！", 2000);
  setTimeout(() => {
    showEvent(p, "⚔️ 判定中...", `${target.name}に挑む！<br>3・2・1...`, false);
    setTimeout(() => {
      const r1 = Math.floor(Math.random()*6)+1, r2 = Math.floor(Math.random()*6)+1;
      const success = r1 >= r2;
      let resText = `${p.name}：🎲${r1} VS ${target.name}：🎲${r2}<br>` + (success ? "成功！入れ替わり！" : "失敗...罰金");
      showEvent(p, success ? "🎊 下剋上成功！" : "💀 敗北...", resText, true);
      if(success) { let tmp = p.pos; p.pos = target.pos; target.pos = tmp; renderBoard(); }
      else { p.money -= 3000; }
    }, 3000);
  }, 2000);
}

function triggerTrade() {
  const p = players[turn];
  const targetName = prompt("誰に賄賂を渡しますか？(名前入力)");
  const target = players.find(x => x.name === targetName);
  if(!target || target === p) return alert("相手が見つかりません");
  p.money -= 3000; target.money += 3000; p.pos = Math.min(squares.length-1, p.pos + 3);
  showEvent(p, "🕶 闇取引", `${target.name}と取引して3マス進んだ！`, true);
  renderBoard();
}

function showEvent(p, title, text, hasBtn) {
  document.getElementById("ev-player").innerText = p.emoji + p.name;
  document.getElementById("ev-text").innerHTML = title;
  document.getElementById("ev-money").innerHTML = text;
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("ev-close").style.display = hasBtn ? "inline-block" : "none";
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  finishTurn();
}

function finishTurn() {
  isMoving = false; document.getElementById("diceBtn").disabled = false;
  globalTurnCount++;
  document.getElementById("turns-left").innerText = 10 - (globalTurnCount % 10);
  if(globalTurnCount % 10 === 0) {
    showAlert("💰 部費徴収！", 2000);
    const sorted = [...players].sort((a,b)=>a.money-b.money);
    players.forEach(p => { if(p !== sorted[0] && p.trait.id !== "fav" && !p.goal) p.money -= 2000; });
  } else if(globalTurnCount % 3 === 0) {
    updateWeather();
  }
  updateStatus();
  if(players.every(pl => pl.goal)) showFinalResults();
  else { do { turn = (turn + 1) % players.length; } while(players[turn].goal); updateStatus(); }
}

function showFinalResults() {
  document.getElementById("result-overlay").style.display = "flex";
  const sorted = [...players].sort((a,b) => b.money - a.money);
  sorted.forEach((p, i) => {
    const item = document.createElement("div"); item.className = "rank-item";
    item.innerHTML = `<span>${i+1}位: ${p.emoji}${p.name}</span> --- <b>${p.money}円</b>`;
    document.getElementById("rank-list").appendChild(item);
    setTimeout(() => { item.classList.add("rank-show"); if(i === sorted.length-1) document.getElementById("restart-btn").style.display="block"; }, i * 800);
  });
}
</script>
</body>
</html>
