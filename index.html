<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：レジェンド・エディション</title>
<style>
  :root { --court-green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --blue: #3498db; }
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #1a1a1a; color: #333; }

  /* レイアウト */
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 15px; }
  #sidebar { flex: 0 0 260px; background: rgba(255, 255, 255, 0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 5px 0 15px rgba(0,0,0,0.3); }
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  
  /* 上部バー */
  #top-bar { background: white; padding: 10px; border-radius: 15px; display: flex; align-items: center; justify-content: space-around; position: relative; }
  #diceNum { font-size: 60px; font-weight: bold; color: var(--court-green); text-shadow: 2px 2px 0 #eee; }
  #collection-timer { position: absolute; right: 20px; top: 10px; background: var(--red); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
  
  /* 盤面 */
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; flex-grow: 1; }
  .square { background: var(--court-green); border: 2px solid white; border-radius: 8px; color: white; padding: 5px; font-size: 11px; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  .type-start { background: #27ae60 !important; }
  .type-goal { background: #2c3e50 !important; }
  .type-reward { background: #f1c40f !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; border: 3px solid #fff; }
  .type-warp { background: var(--blue) !important; }

  /* ステータスカード */
  .money-card { padding: 10px; border-radius: 12px; background: #fff; border: 4px solid #ddd; font-size: 14px; transition: all 0.3s; }
  .active-p { border-color: #ffde59; transform: scale(1.03); box-shadow: 0 0 20px rgba(255,222,89,0.6); }
  .is-awakened { border-color: var(--gold) !important; background: #fffde6 !important; animation: glow 1s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 5px var(--gold); } to { box-shadow: 0 0 25px var(--gold); } }
  .status-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 5px; font-weight: bold; color: white; }

  /* 駒 */
  .token { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; display: inline-block; margin: 2px; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  /* オーバーレイ共通 */
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 10000; background: rgba(0,0,0,0.9); flex-direction: column; color: white; text-align: center; }
  .event-card { background: white; color: #333; padding: 50px; border-radius: 40px; width: 80%; max-width: 900px; border: 12px solid var(--court-green); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
  .awakened-card { border-color: var(--gold) !important; background: linear-gradient(135deg, #fff, #fffde6) !important; }
  
  button { padding: 18px 45px; font-size: 28px; background: var(--court-green); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 0 #1e5e3a; transition: 0.1s; }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e5e3a; }
</style>
</head>
<body>

<div id="rule-overlay" class="full-overlay" style="display:none;">
  <div class="event-card">
    <h1 style="color:var(--court-green); font-size:45px; margin-top:0;">🎾 テニス部人生ゲーム</h1>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; text-align:left; margin:30px 0;">
      <div style="background:#f9f9f9; padding:15px; border-radius:15px; border-left:8px solid var(--gold);"><b>⚡️ 覚醒</b>: 2回連続好調で突入！出目が4以上に固定。</div>
      <div style="background:#f9f9f9; padding:15px; border-radius:15px; border-left:8px solid #888;"><b>🧶 球拾い</b>: 2回連続不調で発生。1回休み。</div>
      <div style="background:#f9f9f9; padding:15px; border-radius:15px; border-left:8px solid var(--red);"><b>💰 部費徴収</b>: 数ターン毎。最下位以外から3000円。</div>
      <div style="background:#f9f9f9; padding:15px; border-radius:15px; border-left:8px solid var(--blue);"><b>🤝 ダブルス</b>: ペアと運命共同体！</div>
    </div>
    <button onclick="closeRule()">部活スタート！</button>
  </div>
</div>

<div id="event-overlay" class="full-overlay">
  <div id="ev-card" class="event-card">
    <div id="ev-player" style="font-size:35px; font-weight:bold;"></div>
    <div id="ev-text" style="font-size:70px; font-weight:bold; margin:20px 0;"></div>
    <div id="ev-money" style="font-size:35px; color:#666; margin-bottom:30px;"></div>
    <button id="ev-close" onclick="closeEvent()">次へ進む</button>
  </div>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:10px 0;">🎾 部員一覧</h3>
    <div id="statusArea"></div>
  </div>
  <div id="game-area">
    <div id="top-bar">
      <div id="diceNum">🎲 ?</div>
      <button id="diceBtn" onclick="rollDice()">サイコロを振る</button>
      <div id="collection-timer">徴収まであと: <span id="turns-left">?</span> 手</div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>

  {t:"normal", txt:"雪で筋トレ", m:-1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"フォーム迷走", m:-1000}, {t:"reward", txt:"OBの差し入れ"},
  {t:"normal", txt:"ダブルス大会", special:"doubles"}, {t:"mini", txt:"★目隠し素振り"}, {t:"normal", txt:"スコア＋", m:2000}, {t:"warp", txt:"ワープ"},
  {t:"normal", txt:"スコア－", m:-1500}, {t:"normal", txt:"ガット張替", m:-2000}, {t:"reward", txt:"おやつタイム"}, {t:"mini", txt:"★コミュ力対決"},
  {t:"normal", txt:"顧問に褒誉", m:1000}, {t:"warp", txt:"ワープ"}, {t:"normal", txt:"サーブ迷走", m:-1000}, {t:"reward", txt:"部費余り"},
  {t:"normal", txt:"すね強打", m:-1000}, {t:"mini", txt:"★フットワーク"}, {t:"normal", txt:"最高の一打", m:2000}, {t:"goal", txt:"引退！"}
];

let players = []; let turn = 0; let isMoving = false; let globalTurnCount = 0;
const collectionInterval = 10; // 何手ごとに徴収するか

window.onload = function() {
  setTimeout(() => {
    let count = parseInt(prompt("部員は何人？")) || 1;
    for(let i=0; i<count; i++){
      players.push({ id:i, name: prompt((i+1)+"人目の名前")||"部員"+(i+1), pos: 0, money: 0, goal: false, color: `hsl(${i*(360/count)}, 70%, 50%)`, streak: 0, awakened: false, penalty: 0 });
    }
    document.getElementById("turns-left").innerText = collectionInterval;
    document.getElementById("rule-overlay").style.display = "flex";
    renderBoard(); updateStatus();
  }, 300);
};

function closeRule() { document.getElementById("rule-overlay").style.display = "none"; }

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => {
    const div = document.createElement("div"); div.className = `square type-${s.t}`;
    div.innerHTML = `<div><small>${i}</small> <b>${s.txt}</b></div><div id="p-at-${i}"></div>`;
    b.appendChild(div);
  });
  players.forEach(p => {
    const t = document.createElement("div"); t.className = "token"; t.style.background = p.color;
    if(p.awakened) t.style.boxShadow = "0 0 15px gold";
    document.getElementById(`p-at-${p.pos}`).appendChild(t);
  });
}
