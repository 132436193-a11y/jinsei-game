<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>女子テニス部人生ゲーム：祝卒業🌸</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --dark: #1a1a1a; --pink: #ff69b4; --cyan: #00ced1; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 5px; box-sizing: border-box; gap: 5px; }
  #sidebar { flex: 0 0 320px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; overflow-y: auto; }
  #statusArea { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .money-card { padding: 6px; border-radius: 8px; background: #fff; border: 2px solid #ddd; position: relative; font-size: 11px; }
  .active-p { border-color: var(--pink); background: #fff5f8; transform: scale(1.02); z-index: 2; box-shadow: 0 0 10px rgba(255,105,180,0.3); }
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 10px; position: relative; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .token-emoji { font-size: 20px; position: absolute; z-index: 10; animation: bounce 1s infinite; transition: 0.5s; text-align: center; }
  .token-name { font-size: 8px; background: rgba(255,255,255,0.8); color: black; padding: 1px 2px; border-radius: 3px; display: block; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 9999; background: rgba(0,0,0,0.8); flex-direction: column; }
  .event-card { background: white; padding: 30px; border-radius: 20px; width: 80%; max-width: 500px; border: 8px solid var(--pink); text-align: center; }
  button.big-btn { padding: 12px 30px; font-size: 18px; background: var(--pink); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; margin: 5px; }
</style>
</head>
<body>

<div id="start-overlay" class="full-overlay" style="display:flex;">
  <div class="scroll-card" id="setup-content" style="background:white; padding:30px; border-radius:30px; max-width:800px; width:90%; color:#333; overflow-y:auto; max-height:90vh;">
    <h1 style="color:var(--pink); text-align:center;">🎾 女子テニス部人生ゲーム 🎾</h1>
    <div id="initial-screen" style="text-align:center;">
      部員数を入力 (最大14人): <br>
      <input type="number" id="p-count" value="4" min="1" max="14" style="font-size:24px; width:80px; text-align:center; margin:15px;">
      <br><button class="big-btn" onclick="generateSetup()">部員登録へ</button>
    </div>
  </div>
</div>

<div id="event-overlay" class="full-overlay">
  <div class="event-card">
    <div id="ev-player" style="font-size:20px; color:var(--pink); font-weight:bold;"></div>
    <div id="ev-text" style="font-size:24px; font-weight:bold; margin:15px 0;"></div>
    <div id="quiz-ui" style="display:none;">
      <p style="font-size:16px;">現実でクイズを出題してください！</p>
      <button class="big-btn" style="background:var(--green);" onclick="resolveQuiz(true)">正解！(ゴール確定)</button>
      <button class="big-btn" style="background:#e74c3c;" onclick="resolveQuiz(false)">不正解…(3マス戻る)</button>
    </div>
    <div id="trade-ui" style="display:none;">
      貸してくれる相手: <select id="trade-target-select" style="font-size:18px;"></select>
      <br>
      <button class="big-btn" style="background:#444;" onclick="executeTradeRoll()">契約して振る(4以上で成功)</button>
      <button class="big-btn" style="background:#888;" onclick="refuseTrade()">断って普通に振る</button>
    </div>
    <div id="game-dice-roll" style="display:none; font-size:40px;">🎲 ?</div>
    <div id="button-area"><button id="ev-close" class="big-btn" onclick="closeEvent()">了解</button></div>
    <button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button>
  </div>
</div>

<div id="result-overlay" class="full-overlay">
  <h1 style="font-size:40px; color:var(--gold);">🏅 引退式 🏅</h1>
  <div id="rank-list"></div>
  <button class="big-btn" onclick="location.reload()">もう一度</button>
</div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; color:var(--pink); margin:5px;">🎀 部員名簿</h3>
    <div id="statusArea"></div>
    <button id="revolt-btn" class="big-btn" style="background:#e67e22; font-size:12px; margin-top:10px; display:none;" onclick="triggerGekokujo()">💥 下剋上</button>
  </div>
  <div id="game-area">
    <div style="display:flex; justify-content:space-around; align-items:center; background:#fff; padding:10px; border-radius:10px;">
      <div id="weather-display" style="padding:5px 15px; border-radius:20px; background:var(--green); color:white; font-weight:bold;">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:40px;">🎲 ?</div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
let players = [], turn = 0, isMoving = false, rouletteTimer = null, currentWeather = {id:"sunny", n:"☀️ 晴れ"};
const emojis_list = ["🎾","🎀","💄","🍦","🌸","⭐","🔥","💧","🍀","🌙","☀️","🌈","🐾","🎨"];
const traits = [
  {id:"fav", n:"顧問の愛弟子", bonus: (w) => 1},
  {id:"sun", n:"晴れ女", bonus: (w) => w.id === "sunny" ? 2 : 0},
  {id:"strong", n:"雑草魂", bonus: (w) => w.id === "rainy" ? 2 : 0},
  {id:"none", n:"普通の部員", bonus: (w) => 0}
];
const weathers = [{id:"sunny", n:"☀️ 晴れ"}, {id:"rainy", n:"☔ 豪雨"}, {id:"windy", n:"🍃 追い風"}];

const squares = [
  {t:"start", txt:"入学！", m:0}, 
  {t:"normal", txt:"ガット張替え。けどパパが払ってくれたｗ", m:2000}, 
  {t:"normal", txt:"練習し過ぎで疲労骨折。保険金おりた！", move:-3, m:5000},
  {t:"reward", txt:"😁ボーナス", m:0}, 
  {t:"normal", txt:"おばちゃんから苦情。全員罰金ですよ？", m:-1000, taxAll:true}, 
  {t:"normal", txt:"福田行く途中にチャリパンク。", m:-1000, skip:true},
  {t:"normal", txt:"スマッシュでラケット破壊。けど懸賞で当たったｗ", m:3000}, 
  {t:"normal", txt:"午前授業が始まる。部活が長過ぎる", m:1000}, 
  {t:"normal", txt:"ラインにつまずいてローリングズッコケ。", m:2000},
  {t:"normal", txt:"祝！中国大会出場！🎉", move:5, m:20000}, 
  {t:"normal", txt:"試合に向けてお守りをもらう！", move:3, m:8000}, 
  {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"前髪終了。美容院代だー", move:-1, m:-500}, 
  {t:"normal", txt:"スコアのポイントプラス！", m:5000}, 
  {t:"normal", txt:"雨で部活オフ！遊びまくる", move:2, m:10000},
  {t:"normal", txt:"靴から無限に砂。", move:-1, m:0}, 
  {t:"normal", txt:"ボレーミスって顔面にボール直撃。", m:-500, skip:true}, 
  {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"先輩から怒られる。お詫びのスイーツ", move:-2, m:-1000}, 
  {t:"normal", txt:"顧問機嫌ワルワルモード。おべっか代", m:-2000}, 
  {t:"normal", txt:"練習中に雪！テンションマックス", move:4, m:5000},
  {t:"normal", txt:"おしゃべりタイム。", m:3000}, 
  {t:"normal", txt:"調子が絶好調！", move:2, m:8000}, 
  {t:"reward", txt:"😁ボーナス", m:0},
  {t:"normal", txt:"ボールホルダー忘れ。", move:-2, m:0}, 
  {t:"normal", txt:"応援で喉枯れる。のど飴もらった", m:1000}, 
  {t:"normal", txt:"日焼け止め塗っても真っ黒！", m:-500},
  {t:"normal", txt:"汗で服の色が変わっちゃった。新調！", move:-1, m:2000}, 
  {t:"normal", txt:"日に日に増える5分間走。健康になったｗ", move:-2, m:5000}, 
  {t:"normal", txt:"写真写り最悪。けどバズったｗ", m:10000},
  {t:"normal", txt:"日焼け止め忘れたーけど、貸してもらったにょ。ガチサンキュー。", move:6, m:12000}, 
  {t:"goal", txt:"引退", m:30000}
];

function generateSetup() {
  const count = parseInt(document.getElementById("p-count").value);
  let html = `<h2 style="color:var(--pink); text-align:center;">部員設定</h2><p style="font-size:12px; text-align:center;">※直接入力はリスト選択より優先されます</p><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px;">`;
  for(let i=0; i<count; i++) {
    html += `<div style="background:#fff0f5; padding:8px; border-radius:8px; font-size:12px; border:1px solid var(--pink);">
      #${i+1} 名前:<input id="n-${i}" style="width:70px;" value="部員${i+1}"><br>
      絵文字入力:<input id="e-custom-${i}" style="width:40px;" placeholder="🔥"> <br>
      リスト選択:<select id="e-${i}">${emojis_list.map((e, idx)=>`<option value="${e}" ${idx===(i % emojis_list.length)?'selected':''}>${e}</option>`).join("")}</select><br>
      特性:<select id="t-${i}">${traits.map(t=>`<option value="${t.id}">${t.n}</option>`).join("")}</select>
    </div>`;
  }
  html += `</div><button class="big-btn" style="margin-top:20px;" onclick="confirmSetup(${count})">部活開始！</button>`;
  document.getElementById("setup-content").innerHTML = html;
}

function confirmSetup(count) {
  players = [];
  for(let i=0; i<count; i++) {
    const customEmoji = document.getElementById(`e-custom-${i}`).value.trim();
    const selectedEmoji = document.getElementById(`e-${i}`).value;
    const traitId = document.getElementById(`t-${i}`).value;
    players.push({
      id:i, name:document.getElementById(`n-${i}`).value, 
      emoji: customEmoji.length > 0 ? customEmoji : selectedEmoji, 
      pos:0, money:0, goal:false, 
      trait:traits.find(tr=>tr.id===traitId), 
      skip:false
    });
  }
  document.getElementById("start-overlay").style.display="none"; renderBoard(); updateStatus();
}

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => b.innerHTML += `<div class="square type-${s.t}" id="sq-${i}"><small>${i}</small><br><b>${s.txt}</b></div>`);
  players.forEach(p => {
    const t = document.createElement("div"); t.className = "token-emoji";
    t.innerHTML = `${p.emoji}<span class="token-name">${p.name}</span>`;
    document.getElementById(`sq-${p.pos}`).appendChild(t);
    t.style.left = (p.id * 4) + "px"; t.style.top = (p.id % 2 * 10) + "px";
  });
}

function updateStatus() {
  const statusArea = document.getElementById("statusArea");
  statusArea.innerHTML = players.map((p, i) => {
    // 休み状態の視覚化ラベルを追加
    const skipLabel = p.skip ? '<span style="color:#e74c3c; font-weight:bold;">💤 休み中</span>' : '';
    return `<div class="money-card ${i===turn?'active-p':''}">
      <b>${p.emoji}${p.name}</b> [${p.trait.n}] ${skipLabel}<br>💰${p.money.toLocaleString()}
    </div>`;
  }).join("");
  document.getElementById("revolt-btn").style.display = (!players[turn].goal && turn !== 0)?"block":"none";
}

function rollDice() {
  if(isMoving || players[turn].goal) return;
  if(players[turn].money < 0) { triggerTradeUI(); return; }
  
  if(players[turn].skip) { 
    players[turn].skip = false; 
    showEvent(players[turn], "復帰", "コートに戻った！「待たせたねｗ」"); 
    updateStatus();
    return; 
  }
  
  if (turn === 0 || players.slice(0, turn).every(pl => pl.goal)) {
    currentWeather = weathers[Math.floor(Math.random()*weathers.length)];
    document.getElementById("weather-display").innerText = currentWeather.n;
  }
  
  startDiceRoll();
}

function startDiceRoll() {
  isMoving = true; document.getElementById("diceBtn").disabled = true;
  let count = 0;
  const timer = setInterval(() => {
    document.getElementById("diceNum").innerText = "🎲 " + (Math.floor(Math.random()*6)+1);
    if(++count > 10) {
      clearInterval(timer);
      let dice = Math.floor(Math.random()*6)+1;
      let bonus = players[turn].trait.bonus(currentWeather);
      let total = dice + bonus;
      document.getElementById("diceNum").innerHTML = `🎲 ${dice}${bonus > 0 ? '<span style="color:red; font-size:20px;">+'+bonus+'</span>' : ''}`;
      setTimeout(() => movePlayer(total), 600);
    }
  }, 60);
}

function movePlayer(steps) {
  let p = players[turn]; 
  p.pos = Math.min(squares.length-1, p.pos + steps); 
  renderBoard(); 
  const s = squares[p.pos];
  
  if(p.pos === squares.length - 1) {
    document.getElementById("ev-close").style.display = "none";
    document.getElementById("quiz-ui").style.display = "block";
    showEvent(p, "最終試練", "ゴール目前！<br>引退前にクイズに答えてください！");
    return;
  }

  if(s.t === "reward") {
    startRoulette();
  } else if(s.taxAll) {
    players.forEach(pl => { if(!pl.goal) pl.money -= 1000; });
    showEvent(p, "連帯責任", s.txt+"<br>全員-1000円！");
    updateStatus();
  } else {
    let amount = s.m || 0;
    p.money += amount;
    if(s.skip) p.skip = true;
    if(s.move) { 
        setTimeout(() => {
            p.pos = Math.max(0, Math.min(squares.length-1, p.pos+s.move)); 
            renderBoard();
        }, 500);
    }
    showEvent(p, "イベント", s.txt + (amount!==0 ? `<br>💰${amount.toLocaleString()}円` : ""));
    updateStatus();
  }
}

function resolveQuiz(isCorrect) {
  const p = players[turn];
  document.getElementById("quiz-ui").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
  
  if(isCorrect) {
    p.money += 30000;
    p.goal = true;
    showEvent(p, "祝・引退✨", "クイズ正解！無事に引退を迎えました！<br>お疲れ様でした！💰30,000円");
  } else {
    p.pos = Math.max(0, p.pos - 3);
    renderBoard();
    showEvent(p, "やり直し💀", "クイズ不正解…<br>まだ引退させてもらえません！3マス戻る");
  }
  updateStatus();
}

function showEvent(p, title, text) {
  document.getElementById("ev-player").innerText = p.emoji + " " + p.name;
  document.getElementById("ev-text").innerHTML = text;
  document.getElementById("event-overlay").style.display = "flex";
}

function closeEvent() {
  document.getElementById("event-overlay").style.display = "none";
  document.getElementById("trade-ui").style.display = "none";
  document.getElementById("game-dice-roll").style.display = "none";
  
  isMoving = false; 
  document.getElementById("diceBtn").disabled = false;
  
  if(players.every(pl => pl.goal)) {
    showResults();
  } else {
    let nextTurn = (turn + 1) % players.length;
    while (players[nextTurn].goal) {
      nextTurn = (nextTurn + 1) % players.length;
    }
    turn = nextTurn;
    updateStatus();
  }
}

function triggerTradeUI() {
  const p = players[turn]; const others = players.filter(t => t !== p);
  const sel = document.getElementById("trade-target-select");
  sel.innerHTML = others.map(t => `<option value="${t.id}">${t.emoji}${t.name}</option>`).join("");
  document.getElementById("trade-ui").style.display = "block";
  showEvent(p, "闇取引", "相手に3000円払い、4以上なら3マス進む＆賞金1万！<br>「ちょっとお金貸して〜ｗ」");
}

function executeTradeRoll() {
  const p = players[turn]; 
  const targetId = document.getElementById("trade-target-select").value;
  const targetPlayer = players.find(pl => pl.id == targetId);

  document.getElementById("trade-ui").style.display = "none";
  document.getElementById("game-dice-roll").style.display = "block";
  let c = 0; const t = setInterval(() => {
    let tempRes = Math.floor(Math.random()*6)+1;
    document.getElementById("game-dice-roll").innerText = "🎲 " + tempRes;
    if(++c > 12) {
      clearInterval(t); 
      const res = Math.floor(Math.random()*6)+1;
      document.getElementById("game-dice-roll").innerText = "🎲 " + res;
      setTimeout(() => {
        if(res >= 4) {
          p.money -= 3000; 
          if(targetPlayer) targetPlayer.money += 3000; 
          p.money += 10000;
          p.pos = Math.min(squares.length-1, p.pos + 3);
          showEvent(p, "大成功✨", "3マス進んで賞金10,000円ゲット！「借りたっけ？もらったｗ」"); renderBoard();
        } else {
          p.money -= 3000; 
          showEvent(p, "大失敗💀", "罰金…");
        }
        updateStatus();
      }, 800);
    }
  }, 60);
}

function refuseTrade() { 
  document.getElementById("trade-ui").style.display = "none";
  document.getElementById("event-overlay").style.display = "none"; 
  startDiceRoll(); 
}

function triggerGekokujo() {
  const p = players[turn]; 
  const ace = [...players].sort((a,b)=>b.pos - a.pos)[0];
  if(ace === p) return;

  document.getElementById("game-dice-roll").style.display = "block";
  showEvent(p, "💥 下剋上", `${ace.name}に挑戦！<br>「そこ、どいて？ｗ」`);
  let c = 0; const t = setInterval(() => {
    document.getElementById("game-dice-roll").innerText = `🎲 ${Math.floor(Math.random()*6)+1} VS 🎲 ${Math.floor(Math.random()*6)+1}`;
    if(++c > 15) {
      clearInterval(t); 
      const r1 = Math.floor(Math.random()*6)+1; 
      const r2 = Math.floor(Math.random()*6)+1;
      document.getElementById("game-dice-roll").innerText = `🎲 ${r1} VS 🎲 ${r2}`;
      setTimeout(() => {
        if(r1 > r2) { 
          let oldPos = p.pos;
          p.pos = ace.pos;
          ace.pos = oldPos;
          showEvent(p, "成功✨", "交代！「エースの座、最高〜ｗ」"); 
        }
        else { p.money -= 1000; showEvent(p, "失敗💀", "罰金…「次、絶対勝つし。」"); }
        renderBoard();
        updateStatus();
      }, 800);
    }
  }, 60);
}

function startRoulette() {
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "inline-block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => { document.getElementById("ev-text").innerText = ["💰5,000円","💰10,000円","💰20,000円","💰30,000円"][Math.floor(Math.random()*4)]; }, 50);
}

function stopRoulette() {
  clearInterval(rouletteTimer);
  const p = players[turn];
  const text = document.getElementById("ev-text").innerText;
  const val = parseInt(text.replace(/[^0-9]/g, ""));
  
  p.money += val;
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
  updateStatus();
}

function showResults() {
  document.getElementById("result-overlay").style.display = "flex";
  const sorted = [...players].sort((a,b) => b.money - a.money);
  document.getElementById("rank-list").innerHTML = sorted.map((p, i) => `<div style="background:white; margin:5px; padding:10px; border-radius:10px;">${i+1}位: ${p.emoji}${p.name} 💰${p.money.toLocaleString()}</div>`).join("");
}
</script>
</body>
</html>
