<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テニス部人生ゲーム：真・完全版</title>
<style>
  :root { --green: #2e8b57; --gold: #ffd700; --red: #e74c3c; --dark: #1a1a1a; }
  body { margin: 0; overflow: hidden; font-family: sans-serif; background: var(--dark); color: #333; }
  .main-container { display: flex; height: 100vh; padding: 10px; box-sizing: border-box; gap: 10px; }
  
  .full-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; z-index: 20000; flex-direction: column; color: white; text-align: center; background: rgba(0,0,0,0.95); }
  .explain-card { background: white; color: #333; padding: 25px; border-radius: 30px; border: 8px solid var(--green); max-width: 800px; width: 95%; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
  
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 15px; }
  .setup-item { border: 1px solid #ddd; padding: 12px; border-radius: 12px; background: #f9f9f9; text-align: left; }
  .setup-item label { font-size: 11px; color: #666; font-weight: bold; display: block; margin-top: 5px; }
  .setup-item input, .setup-item select { width: 100%; padding: 6px; margin-top: 2px; border: 1px solid var(--green); border-radius: 5px; box-sizing: border-box; }

  button.big-btn { font-size: 20px; padding: 12px 35px; border-radius: 50px; background: var(--green); color: white; cursor: pointer; border: none; font-weight: bold; box-shadow: 0 5px 0 #1b5e38; transition: 0.1s; margin: 5px; }
  button.big-btn:active { transform: translateY(3px); box-shadow: none; }
  button.warn-btn { background: var(--red); box-shadow: 0 5px 0 #900; }
  button.dark-btn { background: #444; box-shadow: 0 5px 0 #222; }

  #sidebar { flex: 0 0 240px; background: rgba(255,255,255,0.9); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; }
  #statusArea { overflow-y: auto; flex-grow: 1; }
  .money-card { padding: 8px; border-radius: 8px; background: #fff; border: 2px solid #ddd; margin-bottom: 5px; }
  .active-p { border-color: #ffde59 !important; background: #fffde0 !important; border-width: 3px; }
  
  #game-area { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  #top-bar { background: white; padding: 10px; border-radius: 15px; display: flex; justify-content: space-around; align-items: center; min-height: 80px; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; flex-grow: 1; }
  .square { background: var(--green); border: 1px solid white; border-radius: 6px; color: white; padding: 4px; font-size: 9px; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
  .type-reward { background: var(--gold) !important; color: #333 !important; }
  .type-mini { background: var(--red) !important; color: white !important; }
  .token-emoji { font-size: 20px; margin-right: -10px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); transition: 0.3s; }
</style>
</head>
<body>

<div id="flow-overlay" class="full-overlay" style="display: flex;">
  <div class="explain-card" id="flow-card">
    <h2 id="flow-title" style="color:var(--green); margin-top:0;">🎾 人数設定</h2>
    <div id="flow-content">
      <input type="number" id="player-count-input" value="14" min="1" max="20" style="font-size: 24px; width: 80px; text-align: center;">
      <br><button class="big-btn" onclick="showStep2ManualInput()">次へ：名簿入力</button>
    </div>
  </div>
</div>

<div id="event-overlay" class="full-overlay"><div class="explain-card" style="text-align:center;"><div id="ev-player" style="font-size:40px;"></div><div id="ev-text" style="font-size:24px; font-weight:bold;"></div><div id="ev-money" style="font-size:32px; color:var(--red); margin:15px 0;"></div><button id="ev-close" class="big-btn" onclick="closeEvent()">次へ</button><button id="roulette-stop" class="big-btn" style="display:none; background:var(--gold); color:#333;" onclick="stopRoulette()">ストップ！</button></div></div>
<div id="result-overlay" class="full-overlay"><h1>🏅 結果発表 🏅</h1><div id="rank-list" style="width: 90%; overflow-y:auto; max-height:70vh;"></div><button class="big-btn" onclick="location.reload()">もう一度</button></div>

<div class="main-container">
  <div id="sidebar">
    <h3 style="text-align:center; margin:5px 0;">部員名簿</h3>
    <div id="statusArea"></div>
  </div>
  <div id="game-area">
    <div id="top-bar">
      <div id="weather-display">☀️ 晴れ</div>
      <div id="diceNum" style="font-size:44px; font-weight:bold;">🎲</div>
      <button id="diceBtn" class="big-btn" onclick="rollDice()">サイコロを振る</button>
      <div id="action-btns" style="display:none;">
        <button class="big-btn warn-btn" onclick="triggerGekokujo()" style="font-size:14px; padding:10px 20px;">異議あり！</button>
        <button class="big-btn dark-btn" onclick="triggerTrade()" style="font-size:14px; padding:10px 20px;">闇取引</button>
      </div>
      <div style="font-size:12px; background:var(--red); color:white; padding:10px; border-radius:10px;">部費まで: <span id="turns-left" style="font-weight:bold;">10</span></div>
    </div>
    <div id="board"></div>
  </div>
</div>

<script>
const squares = [{t:"start", txt:"集合"}, {t:"normal", txt:"ガット切れ", m:-3000}, {t:"normal", txt:"チャリパンク", m:-1000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"大会決定", m:5000}, {t:"mini", txt:"☠"}, {t:"normal", txt:"特訓", m:500}, {t:"normal", txt:"練習", m:-500}, {t:"normal", txt:"勝利", m:5000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"休み", m:0}, {t:"mini", txt:"☠"}, {t:"normal", txt:"筋トレ", m:-500}, {t:"normal", txt:"朝練", m:1000}, {t:"normal", txt:"好調", m:2000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"遠征費", m:-2000}, {t:"mini", txt:"☠"}, {t:"normal", txt:"ボーナス", m:3000}, {t:"normal", txt:"掃除", m:200}, {t:"normal", txt:"忘れ物", m:-1000}, {t:"normal", txt:"ガット張替", m:-1500}, {t:"reward", txt:"😁"}, {t:"mini", txt:"☠"}, {t:"normal", txt:"褒美", m:2000}, {t:"normal", txt:"自主練", m:1000}, {t:"normal", txt:"練習集中", m:1000}, {t:"reward", txt:"😁"}, {t:"normal", txt:"強打失敗", m:-1000}, {t:"mini", txt:"☠"}, {t:"normal", txt:"絶好調", m:4000}, {t:"goal", txt:"引退"}];
const traits = [{id:"none", name:"普通の部員"}, {id:"fav", name:"顧問の愛弟子"}, {id:"sun", name:"晴れ男/女"}, {id:"wind", name:"追い風マスタ"}, {id:"strong", name:"雑草魂"}];
const miniGames = ["タイヤ引き対決", "100本ノック耐え", "ボレーボレー耐久", "サーブ的当て勝負", "坂道ダッシュ対決", "ボール拾い競争"];

let players = [], turn = 0, isMoving = false, globalTurnCount = 0, currentWeather = "sunny", rouletteTimer;

function showStep2ManualInput() {
  const count = parseInt(document.getElementById("player-count-input").value) || 14;
  document.getElementById("flow-title").innerText = "🎾 情報を入力";
  let html = '<div class="setup-grid">';
  for(let i=1; i<=count; i++) {
    html += `<div class="setup-item"><strong>部員 ${i}</strong><label>名前</label><input type="text" id="p-name-${i}" oninput="if(this.value && !document.getElementById('p-emoji-${i}').value) document.getElementById('p-emoji-${i}').value='🎾'"><label>絵文字</label><input type="text" id="p-emoji-${i}"><label>特性</label><select id="p-trait-${i}">${traits.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div>`;
  }
  html += `</div><button class="big-btn" onclick="processManualAndNext(${count})">次へ：ルール確認</button>`;
  document.getElementById("flow-content").innerHTML = html;
}

function processManualAndNext(count) {
  players = [];
  for(let i=1; i<=count; i++) {
    players.push({ id: i-1, name: document.getElementById(`p-name-${i}`).value || `部員${i}`, emoji: document.getElementById(`p-emoji-${i}`).value || "🎾", trait: traits.find(t=>t.id===document.getElementById(`p-trait-${i}`).value), pos: 0, money: 0, goal: false });
  }
  showStep3Rules();
}

function showStep3Rules() {
  document.getElementById("flow-title").innerText = "📜 ルール説明";
  document.getElementById("flow-content").innerHTML = `<div style="text-align:left; line-height:1.8;"><b>■ 基本：</b>ゴール時に一番金持ちが勝ち。<br><b>■ 特権：</b>自分のターンに「下剋上」や「闇取引」が可能。<br><b>■ 対決：</b>☠マスではミニゲームの内容がルーレットで決まる！</div><button class="big-btn" onclick="startGame()">スタート！</button>`;
}

function startGame() { document.getElementById("flow-overlay").style.display = "none"; renderBoard(); updateStatus(); document.getElementById("action-btns").style.display = "block"; }

function rollDice() {
  if(isMoving || players[turn].goal) return;
  isMoving = true;
  document.getElementById("diceBtn").style.display = "none";
  document.getElementById("action-btns").style.display = "none";
  const d = document.getElementById("diceNum");
  let count = 0;
  const timer = setInterval(() => {
    d.innerText = ["🎲","⚀","⚁","⚂","⚃","⚄","⚅"][Math.floor(Math.random()*6)+1];
    if(++count > 15) {
      clearInterval(timer);
      let step = Math.floor(Math.random()*6)+1;
      d.innerText = "🎲 " + step;
      setTimeout(() => move(step), 500);
    }
  }, 60);
}

function move(s) {
  let p = players[turn]; p.pos = Math.min(squares.length-1, p.pos + s);
  if(p.pos === squares.length-1) { p.goal = true; p.money += 30000; }
  renderBoard(); setTimeout(() => processSquare(p, squares[p.pos]), 300);
}

function processSquare(p, s) {
  if (s.t === "mini") {
    startMiniGameRoulette(p);
  } else if (s.t === "reward") {
    startRewardRoulette(p);
  } else {
    let amt = s.m || 0; if(amt < 0 && p.trait.id === "strong") amt = Math.floor(amt / 2);
    p.money += amt; showEvent(p, amt >= 0 ? "👍 ラッキー" : "👎 事件", s.txt + (amt ? `<br>${amt}円` : ""));
  }
}

function startMiniGameRoulette(p) {
  document.getElementById("ev-player").innerHTML = `${p.emoji} ${p.name}`;
  document.getElementById("ev-text").innerText = "☠ 対決内容抽選中...";
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "inline-block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => { 
    const game = miniGames[Math.floor(Math.random()*miniGames.length)];
    document.getElementById("ev-money").innerText = game;
    p._lastEv = game;
  }, 60);
}

function startRewardRoulette(p) {
  document.getElementById("ev-player").innerHTML = `${p.emoji} ${p.name}`;
  document.getElementById("ev-text").innerText = "✨ ご褒美ルーレット！";
  document.getElementById("event-overlay").style.display = "flex";
  document.getElementById("roulette-stop").style.display = "inline-block";
  document.getElementById("ev-close").style.display = "none";
  rouletteTimer = setInterval(() => { 
    const r = [500, 5000, 10000, 20000][Math.floor(Math.random()*4)];
    document.getElementById("ev-money").innerText = "+" + r + "円！";
    p._lastAmt = r;
  }, 60);
}

function stopRoulette() { 
  clearInterval(rouletteTimer);
  const p = players[turn];
  if(p._lastEv) {
    document.getElementById("ev-text").innerText = "☠ 対決確定！";
    document.getElementById("ev-money").innerHTML = `${p._lastEv}<br><span style="font-size:18px;color:gold;">見事勝利！+2000円</span>`;
    p.money += 2000;
    p._lastEv = null;
  } else {
    p.money += p._lastAmt;
  }
  document.getElementById("roulette-stop").style.display = "none";
  document.getElementById("ev-close").style.display = "inline-block";
}

function triggerGekokujo() {
  const top = [...players].sort((a,b)=>b.pos - a.pos)[0]; const p = players[turn];
  if(p === top) return alert("君が1位だ！");
  if(!confirm("1位と入れ替わるチャンス！勝負する？")) return;
  const pR = Math.floor(Math.random()*6)+1; const tR = Math.floor(Math.random()*6)+1;
  alert(`あなた:${pR} vs 1位:${tR}`);
  if(pR > tR) { alert("下剋上成功！"); const tmp = p.pos; p.pos = top.pos; top.pos = tmp; renderBoard(); }
  else { alert("失敗…-2000円"); p.money -= 2000; updateStatus(); }
}

function triggerTrade() {
  const p = players[turn]; const tName = prompt("取引相手の名前は？");
  const target = players.find(x => x.name === tName);
  if(!target || target === p) return;
  const amt = parseInt(prompt(`${target.name}へ渡す賄賂の金額は？（3マス進む）`));
  if(isNaN(amt) || p.money < amt) return;
  p.money -= amt; target.money += amt; p.pos = Math.min(squares.length-1, p.pos + 3);
  alert("取引完了！"); renderBoard(); updateStatus();
}

function showEvent(p, t, txt) { document.getElementById("ev-player").innerHTML = `${p.emoji} ${p.name}`; document.getElementById("ev-text").innerText = t; document.getElementById("ev-money").innerHTML = txt; document.getElementById("event-overlay").style.display = "flex"; }

function closeEvent() { 
  document.getElementById("event-overlay").style.display = "none"; globalTurnCount++;
  if(globalTurnCount % 10 === 0) {
    const sorted = [...players].sort((a,b) => a.money - b.money);
    players.forEach(pl => { if(pl !== sorted[0] && pl.trait.id !== "fav" && !pl.goal) pl.money -= 3000; });
    alert("💰 定期徴収！");
  }
  document.getElementById("turns-left").innerText = 10 - (globalTurnCount % 10);
  isMoving = false;
  if(players.every(pl => pl.goal)) {
    document.getElementById("result-overlay").style.display = "flex";
    const res = [...players].sort((a,b) => b.money - a.money);
    document.getElementById("rank-list").innerHTML = res.map((p, i) => `<div>${i+1}位: ${p.emoji} ${p.name} 💰${p.money}</div>`).join("");
  } else { 
    do { turn = (turn + 1) % players.length; } while(players[turn].goal);
    document.getElementById("diceBtn").style.display = "inline-block";
    document.getElementById("action-btns").style.display = "block";
    updateStatus(); 
  }
}

function renderBoard() {
  const b = document.getElementById("board"); b.innerHTML = "";
  squares.forEach((s, i) => { b.innerHTML += `<div class="square type-${s.t}"><small>${i}</small><b>${s.txt}</b><div id="p-at-${i}" style="display:flex; flex-wrap:wrap;"></div></div>`; });
  players.forEach(p => { const t = document.createElement("span"); t.className = "token-emoji"; t.innerText = p.emoji; document.getElementById(`p-at-${p.pos}`).appendChild(t); });
}

function updateStatus() {
  document.getElementById("statusArea").innerHTML = players.map((p, i) => `<div class="money-card ${i===turn?'active-p':''}"> ${p.emoji} <b>${p.name}</b><br>💰 ${p.money}円<br><small>${p.trait.name}</small></div>`).join("");
}
</script>
</body>
</html>
